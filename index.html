<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Álomház</title>
<meta name="theme-color" content="#2F5D50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Álomház">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#F3F5F3; --surface:#FFFFFF; --surface2:#F8FAF9; --ink:#1E2B2F; --muted:#69767A; --line:#E0E5E2;
  --pine:#2F5D50; --pine-soft:#E2ECE7; --oak:#B07D48; --oak-soft:#F4EADF;
  --danger:#B4443A; --danger-soft:#F7E4E2; --ok:#3E7D5A;
  --shadow:0 1px 2px rgba(30,43,47,.06), 0 8px 24px rgba(30,43,47,.05);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121819; --surface:#1A2224; --surface2:#1F282A; --ink:#E6ECEA; --muted:#93A0A2; --line:#2A3537;
    --pine:#72B19B; --pine-soft:#1E322C; --oak:#D4A26F; --oak-soft:#382C20;
    --danger:#E07A70; --danger-soft:#3A2220; --ok:#74B98F;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121819; --surface:#1A2224; --surface2:#1F282A; --ink:#E6ECEA; --muted:#93A0A2; --line:#2A3537;
  --pine:#72B19B; --pine-soft:#1E322C; --oak:#D4A26F; --oak-soft:#382C20;
  --danger:#E07A70; --danger-soft:#3A2220; --ok:#74B98F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.lucide{width:18px;height:18px;stroke-width:1.8;flex:none}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}

.app{display:grid;grid-template-columns:268px 1fr;min-height:100%}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--pine);color:#fff;display:grid;place-items:center}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pine);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;margin:0 4px 14px}
.add-btn:hover{filter:brightness(1.08)}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:14px;font-weight:500}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--pine-soft);color:var(--pine);font-weight:600}
.nav-item .pct{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.nav-item.active .pct{color:var(--pine)}
.nav-group{font-size:12px;color:var(--muted);padding:16px 10px 6px;font-weight:600}
.nav-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.nav-quiet{font-size:12.5px;color:var(--muted)}
.nav-quiet svg.lucide{width:15px;height:15px}

/* Main */
.main{padding:32px 40px 80px;max-width:1240px;width:100%}
.topbar{display:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.005em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Hero */
.hero{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 34px;margin-bottom:22px}
.house{position:relative}
.house svg{width:100%;height:auto;display:block}
.house-fill{transition:y 1.4s cubic-bezier(.2,.7,.2,1),height 1.4s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.house-fill{transition:none}}
.house-pct{text-align:center;margin-top:10px}
.house-pct b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.house-pct span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.kpi-lbl{color:var(--muted);font-size:13px;font-weight:500}
.kpi-big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:4px 0 2px}
.kpi-of{color:var(--muted);font-size:14px}
.meter{height:12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:flex;margin:18px 0 10px}
.meter i{display:block;height:100%}
.meter .m-spent{background:var(--pine)}
.meter .m-comm{background:repeating-linear-gradient(135deg,var(--oak) 0 5px,var(--oak-soft) 5px 9px)}
.meter .m-over{background:var(--danger)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.kpis div b{display:block;font-size:16px;font-weight:700;margin-top:2px;white-space:nowrap}
.movein{display:flex;gap:10px;align-items:center;margin-top:18px;background:var(--pine-soft);color:var(--pine);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500}
.movein b{font-weight:700}

.grid2{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px}

/* Phase rows */
.phase{display:grid;grid-template-columns:38px minmax(150px,1.3fr) 1.4fr 72px;gap:14px;align-items:center;padding:12px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:10px}
.phase:first-of-type{border-top:0}
.phase:hover{background:var(--surface2)}
.ico,.mini-ico,.nav-ico,.pick-ico{--c:#2F5D50;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 82%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 78%,#000) 100%);
  box-shadow:0 3px 8px color-mix(in srgb,var(--c) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.28)}
.ico svg.lucide,.mini-ico svg.lucide,.nav-ico svg.lucide,.pick-ico svg.lucide{stroke-width:2.1}
.ico{width:38px;height:38px;border-radius:12px}
.phase-name{font-weight:600;font-size:14px;line-height:1.3}
.phase-meta{font-size:12px;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.money-line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px;gap:8px}
.money-line b{color:var(--ink);font-weight:600}
.over b{color:var(--danger)}
.ring{--p:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--pine) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;justify-self:end}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700}
.phase:hover .ring span{background:var(--surface2)}

/* Lists */
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.mini-ico{width:30px;height:30px;border-radius:9px}
.nav-ico{width:26px;height:26px;border-radius:8px}
.nav-ico svg.lucide{width:14px;height:14px}
.pick-ico{width:34px;height:34px;border-radius:10px}
.pick-ico svg.lucide{width:17px;height:17px}
.cat-pick button.on .pick-ico{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.mini-ico svg.lucide{width:15px;height:15px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.pine{background:var(--pine-soft);color:var(--pine);border-color:transparent}
.chip.oak{background:var(--oak-soft);color:var(--oak);border-color:transparent}
.chip.red{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.who{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px}
.who-Bence{background:var(--pine-soft);color:var(--pine)}
.who-Ancsi{background:var(--oak-soft);color:var(--oak)}
.who-Közös{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--pine)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;font-size:14px;font-weight:500;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--pine);background:var(--surface)}
textarea.inp{resize:vertical;min-height:70px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Category page */
.cat-head{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.cat-head .ico{width:56px;height:56px;border-radius:16px}
.cat-head .ico svg.lucide{width:26px;height:26px}
.progress-panel{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.progress-panel .big{font-size:36px;font-weight:800;letter-spacing:-.03em;min-width:92px}
input[type=range]{flex:1;min-width:200px;accent-color:var(--pine);height:28px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.fin div{background:var(--surface2);border-radius:12px;padding:10px 12px}
.fin b{display:block;font-size:16px;font-weight:700}
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--pine);flex:none}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task-add{display:grid;grid-template-columns:1fr 140px 120px auto;gap:8px;margin-top:12px}
.quote{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-top:10px}
.quote.acc{border-color:var(--oak);background:var(--oak-soft)}
.quote.rej{opacity:.55}
.util{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface2)}
.util dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0;font-size:13px}
.util dt{color:var(--muted)}
.util dd{margin:0;font-weight:600;word-break:break-word}
.sale-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
.wf{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.wf:first-child{border-top:0}
.wf.neg span:last-child{color:var(--danger);font-weight:600}
.wf.total{border-top:2px solid var(--ink);margin-top:4px;padding-top:10px;font-weight:800;font-size:17px}
.ded{display:grid;grid-template-columns:1fr 130px auto auto;gap:6px;align-items:center;margin-top:8px}
.ded.settled .inp{opacity:.5;text-decoration:line-through}
.ded label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.ded input[type=checkbox],.inv-toggle input{width:17px;height:17px;accent-color:var(--pine)}
.inv-toggle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:10px}
.ret{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ret b{display:block;font-size:17px;font-weight:800}
@media (max-width:1080px){.sale-grid{grid-template-columns:1fr}}
.catrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line)}
.catrow:first-of-type{border-top:0}
.catrow .mv{display:flex;flex-direction:column}
.catrow .mv .icon-btn{padding:2px}
.catrow .mv .icon-btn[disabled]{opacity:.25;cursor:default}
.catrow .nm{flex:1;min-width:0;cursor:pointer}
.catrow .nm b{font-weight:600;font-size:14px;display:block}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.icon-grid button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-grid button.on{border-color:var(--c);background:var(--c);color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;background:var(--s)}
.swatches button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--s)}
.tip{background:var(--pine-soft);color:var(--ink);border-radius:14px;padding:14px 16px;font-size:13.5px;margin-bottom:22px}
.tip b{color:var(--pine)}
.utils{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl-wrap{overflow-x:auto}
.month-h{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 4px;display:flex;justify-content:space-between}

.split-bar{height:16px;border-radius:99px;overflow:hidden;display:flex;margin:14px 0 10px}
.split-bar i{display:block;height:100%}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(18,24,25,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:20px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease}
.modal h3{margin:0 0 16px;font-size:18px;font-weight:700}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.amount-in{font-size:30px;font-weight:800;letter-spacing:-.02em;padding:12px 14px;text-align:right}
.cat-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.cat-pick button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--muted);line-height:1.2;text-align:center}
.cat-pick button.on{border-color:var(--pine);background:var(--pine-soft);color:var(--pine)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:60;animation:pop .2s ease}
.fab{display:none}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.rec-head{display:flex;align-items:center;gap:10px}
.rec-head b{font-size:15px;display:block;line-height:1.25}
.rec dl{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:2px 12px;margin:12px 0 0;font-size:13.5px}
.rec dt{color:var(--muted);padding:5px 0}
.rec dd{margin:0;font-weight:600;display:flex;align-items:center;gap:4px;min-width:0;word-break:break-word}
.rec dd a{color:var(--pine)}
.rec dd .cp{opacity:.55;padding:4px;margin-left:auto}
.rec dd .cp:hover{opacity:1}
.rec dd .cp svg.lucide{width:14px;height:14px}
.rec .rnote{margin-top:10px;font-size:13px;color:var(--muted);white-space:pre-wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chips button.on{background:var(--pine);border-color:var(--pine);color:#fff}
.fld{display:grid;grid-template-columns:minmax(120px,0.8fr) 1.2fr auto;gap:6px;margin-top:6px}
.rec-group{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
#print{display:none}
@media print{
  .app,.fab,#layer,.login,.toast,.scrim,.topbar{display:none!important}
  #print{display:block!important}
  html,body{background:#fff!important;color:#111!important;height:auto}
  :root{padding:0!important}
  body::before{display:none!important}
}
@page{size:A4;margin:14mm 12mm}
#print{font-family:Montserrat,-apple-system,sans-serif;color:#111;font-size:10pt;line-height:1.4}
#print .pr-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #2F5D50;padding-bottom:10px;margin-bottom:14px}
#print .pr-brand{color:#2F5D50;font-weight:800;font-size:10pt;letter-spacing:.04em}
#print h1{font-size:17pt;margin:2px 0;color:#111}
#print h2{font-size:12pt;margin:18px 0 6px;color:#2F5D50}
#print .pr-sub{color:#555}
#print .pr-meta{text-align:right;color:#555;font-size:8.5pt;white-space:nowrap}

.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:20px}
.login-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:var(--shadow)}
.login-card .brand-mark{width:52px;height:52px;border-radius:16px;margin-bottom:14px}
.login-card h1{font-size:24px;margin-bottom:4px}
.login-card form{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.login-err{color:var(--danger);font-size:13px;font-weight:600;min-height:18px}
.linkbtn{border:0;background:none;color:var(--pine);font-weight:600;cursor:pointer;padding:4px 0;font-size:13.5px;text-align:left}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);font-weight:600}
.sync{font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 4px 0;display:flex;flex-direction:column;gap:4px}
.sync .row{display:flex;align-items:center;gap:7px}
.sync .sdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.sync .sdot.off{background:var(--oak)}
.sync .sdot.err{background:var(--danger)}
.sync button{border:0;background:none;color:var(--pine);font-weight:600;cursor:pointer;padding:0;font-size:12px}
.proto-note{font-size:12px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:10px 4px 0}

/* Responsive */
@media (max-width:1080px){
  .grid2{grid-template-columns:1fr}
  .hero{grid-template-columns:220px 1fr;gap:24px}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}

  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.3)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
  .topbar b{font-weight:800}
  .main{padding:20px 16px 110px}
  .hero{grid-template-columns:1fr;padding:22px 20px;text-align:left}
  .house{max-width:220px;margin:0 auto}
  .kpi-big{font-size:34px}
  .cat-grid,.form-grid{grid-template-columns:1fr}
  .phase{grid-template-columns:38px 1fr 52px}
  .phase .phase-money{grid-column:2/3}
  .phase .ring{grid-row:1/3;grid-column:3}
  .task-add{grid-template-columns:1fr 1fr}

  .fab{display:flex;position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--pine);color:#fff;border:0;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(47,93,80,.4);z-index:35;cursor:pointer}

]}

const UTIL_STATUS=['Nincs elindítva','Megrendelve','Folyamatban','Bekötve'];

function seed(){

    cats:DEFAULT_CATS.map(c=>({...c,budget:0,progress:0,start:'',end:'',contractor:'',phone:'',email:'',notes:''})),
    expenses:[
      ex('telek','Elektrosmog mérés',95000,'2026-03-13','Bence','Számlázva',85000),
      ex('telek','Telek vásárlás',12000000,'2026-03-25','Bence','Telek + út',12000000),
      ex('telek','Telek vásárlás',2500000,'2026-03-25','Bence','Telek + út',2500000),
      ex('telek','Telek vásárlás',3000000,'2026-03-25','Ancsi','Telek + út',3000000),
      ex('telek','Telek vásárlás',2500000,'2026-03-25','Bence','Telek + út',2500000),
      ex('illetek','Ingatlan-nyilvántartási igazgatási szolgáltatási díj',31800,'2026-03-26','Bence','Földhivatal',31800),
      ex('illetek','Közös tulajdonú út – illeték',40000,'2026-07-09','Bence','OTP magánról utalva',40000,'2026-07-29'),
      ex('telek','Fűnyírás',15000,'2026-04-29','Bence','3. nyírás',100000),
      ex('kozmu','Szekrény kulcs',2000,'2026-09-22','Bence','',2000)
    ],
    quotes:[
      {id:uid(),catId:'kozmu',vendor:'Áram bővítés 3×32A-re',amount:260000,date:'',note:'3×16A-ről 3×32A-re',status:'Beérkezett'},

      {id:uid(),catId:'kozmu',vendor:'H-tarifás áram',amount:300000,date:'',note:'3×20A, ez csak az amper ára',status:'Beérkezett'},
      {id:uid(),catId:'terv',vendor:'Geodézia',amount:250000,date:'',note:'',status:'Beérkezett'}
    ],

      tk('','Ági pénz visszafizetése',false,'2027-01-01','Bence','2 500 000 Ft'),
      tk('telek','Fűnyíratás átbeszélése – Karesz',true,'','Bence','2 500 Ft / óra'),
      tk('illetek','Ingatlan-nyilvántartási díj befizetése',true,'2026-03-28','Bence','CIB, 31 800 Ft','2026-03-26'),

function ex(catId,desc,amount,date,paidBy,note,planned,due){return {id:uid(),created:Date.now(),catId,desc,amount,date,paidBy,note:note||'',planned:planned||0,due:due||'',status:'Fizetve'}}
function tk(catId,title,done,due,who,note,doneDate){return {id:uid(),catId,title,done,due:due||'',who:who||'',note:note||'',doneDate:doneDate||''}}
function defaultSale(price){return {listPrice:89900000,price:price||73000000,commPct:3,commExtraPct:9.72,
  deductions:[{id:uid(),name:'Bankhitel kiváltása',amount:6179080,settled:false},{id:uid(),name:'Széchenyi kártya (cég) – felhasznált keret',amount:0,settled:false}],
  invested:false,investName:'',investAmount:0,investDate:'',investValue:0}}
function saleCalc(s){
  const comm=Math.round((s.price||0)*(s.commPct||0)/100*(1+(s.commExtraPct||0)/100));
  const ded=(s.deductions||[]).filter(d=>!d.settled).reduce((a,d)=>a+(d.amount||0),0);
  const net=(s.price||0)-comm-ded;
  const inv=s.invested?(s.investAmount||0):0, val=s.invested?(s.investValue||s.investAmount||0):0;
  const gain=val-inv, pct=inv?gain/inv*100:0;
  let ann=null; if(s.invested&&s.investDate&&inv&&val){const yrs=(Date.now()-toD(s.investDate).getTime())/(365.25*864e5);if(yrs>0.08)ann=(Math.pow(val/inv,1/yrs)-1)*100}
  return {comm,ded,net,inv,val,gain,pct,ann,avail:net-inv+val};
}
const fAmt=f=>f.sale?saleCalc(f.sale).avail:(f.amount||0);

  {id:uid(),kind:'forras',type:'Ingatlaneladás',name:'Torda utca 15. eladása',amount:0,date:'',owner:'Bence',status:'Várható',note:'7627 Pécs, Torda utca 15.',sale:defaultSale()},
  {id:uid(),kind:'kolcson',type:'Családi kölcsön',name:'Ibolya néni',amount:2500000,date:'',owner:'Bence',status:'Megérkezett',repayDue:'2026-05-01',repaid:true,repaidDate:'2026-05-01',note:''},

]}
const FUND_TYPES=['Ingatlaneladás','Megtakarítás','Bankhitel','Támogatás','Családi kölcsön','Baráti kölcsön','Egyéb'];
const FUND_ICON={'Ingatlaneladás':'home','Megtakarítás':'wallet','Bankhitel':'landmark','Támogatás':'landmark','Családi kölcsön':'user','Baráti kölcsön':'user','Egyéb':'wallet'};
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function stable(o){if(Array.isArray(o))return '['+o.map(stable).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';return JSON.stringify(o===undefined?null:o)}
let S={settings:{},cats:[],expenses:[],quotes:[],tasks:[],funding:[],utilities:[],records:[]};
let recQ='', recT='';
const synced={};COLLS.forEach(c=>synced[c]=new Map());let syncedSettings='';
let view='dash';
let filt={cat:'',who:''};
// Csak a megváltozott tételeket küldi fel az adatbázisba
function save(){
  if(!window.Backend||!READY)return;
  COLLS.forEach(c=>{const seen=new Set();
    (S[c]||[]).forEach((it,i)=>{if(c==='cats')it.order=i;const j=stable(it);seen.add(it.id);
      if(synced[c].get(it.id)!==j){synced[c].set(it.id,j);Backend.put(c,it.id,JSON.parse(j))}});
    [...synced[c].keys()].forEach(id=>{if(!seen.has(id)){synced[c].delete(id);Backend.del(c,id)}});
  });
  const sj=stable(S.settings||{});if(sj!==syncedSettings){syncedSettings=sj;Backend.putSettings(JSON.parse(sj))}
}
function newCat(id,name,icon,color,scope,share){return {id,name,icon,color,scope,share,budget:0,progress:0,start:'',end:'',contractor:'',phone:'',email:'',notes:''}}
function migrate(){
  if(S.settings.mig1||!S.cats.length)return;
  const fold=cat('fold');
  if(fold&&fold.name==='Földmunka és alapozás'){fold.name='Földmunka';fold.share=4;if(!cat('alapozas'))S.cats.splice(S.cats.indexOf(fold)+1,0,newCat('alapozas','Alapozás','layers','#7D6B5D','haz',6))}
  const kert=cat('kert');
  if(kert&&kert.name==='Kert és kerítés'){kert.name='Kert';kert.share=1.5;if(!cat('kerites'))S.cats.splice(S.cats.indexOf(kert)+1,0,newCat('kerites','Kerítés','fence','#5E8C31','haz',1.5))}
  S.records=S.records||[];
  (S.utilities||[]).forEach(u=>S.records.push(utilToRecord(u)));S.utilities=[];
  if(!S.records.some(r=>r.type==='Ingatlan / hrsz'))S.records.push(...seedLand());
  S.settings.mig1=true;save();
}
function fixFunding(list){(list||[]).forEach(f=>{if(f.type==='Ingatlaneladás'&&!f.sale)f.sale=defaultSale()});return list}
const APP={
  applyRemote(c,items){if(c==='cats')items.sort((a,b)=>(a.order??0)-(b.order??0));if(c==='funding')fixFunding(items);
    S[c]=items;synced[c]=new Map(items.map(it=>[it.id,stable(it)]));scheduleRender()},
  applySettings(s){S.settings=s||{};syncedSettings=stable(S.settings);scheduleRender()},
  seedAll(){const d=seed();READY=true;Object.assign(S,d);save()},
  ready(email){ME=USERS[(email||'').toLowerCase()]||'Bence';READY=true;migrate();scheduleRender(true)},
  setStatus(st){const el=document.getElementById('sync-st');if(!el)return;
    const m={ok:['','Szinkronizálva'],pending:['off','Mentés folyamatban…'],offline:['off','Offline – net után szinkronizál'],error:['err','Hiba a szinkronban']}[st]||['','Szinkronizálva'];
    el.innerHTML=`<span class="sdot ${m[0]}"></span>${m[1]}`},
  importData(d){COLLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c]:[]);S.settings=d.settings||S.settings;fixFunding(S.funding);save();render()}
};
window.APP=APP;
function scheduleRender(force){
  if(!READY)return;
  const ae=document.activeElement,busy=document.getElementById('layer').innerHTML!==''||(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName));
  if(busy&&!force){pendingRender=true;return}
  render();
}
setInterval(()=>{if(pendingRender)scheduleRender()},1500);

/* ---------- helpers ---------- */
const nf=new Intl.NumberFormat('hu-HU',{maximumFractionDigits:0});
const ft=n=>nf.format(Math.round(n||0))+' Ft';
const fm=n=>ft(n);
const amt=s=>Number(String(s||'').replace(/[^\d]/g,''))||0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
const toD=iso=>iso?new Date(iso+'T12:00:00'):null;
function fd(iso){if(!iso)return '';return toD(iso).toLocaleDateString('hu-HU',{year:'numeric',month:'short',day:'numeric'})}
function fdl(d){return d.toLocaleDateString('hu-HU',{year:'numeric',month:'long',day:'numeric'})}
const cat=id=>S.cats.find(c=>c.id===id);
const paid=e=>e.status!=='Fizetendő';
const spent=id=>S.expenses.filter(e=>e.catId===id&&paid(e)).reduce((a,e)=>a+e.amount,0);
const pending=id=>S.expenses.filter(e=>e.catId===id&&!paid(e)).reduce((a,e)=>a+e.amount,0);
const committed=id=>S.quotes.filter(q=>q.catId===id&&q.status==='Elfogadva').reduce((a,q)=>a+q.amount,0);
const hazCats=()=>S.cats.filter(c=>c.scope==='haz');
function weight(c){const h=hazCats();const anyBudget=h.some(x=>x.budget>0);return anyBudget?(c.budget||0):(c.share||1)}
function overall(){const h=hazCats();let w=0,p=0;h.forEach(c=>{const x=weight(c);w+=x;p+=x*c.progress});return w?p/w:0}
function totals(){
  const h=hazCats().map(c=>c.id), o=S.cats.filter(c=>c.scope!=='haz').map(c=>c.id);
  const hs=S.expenses.filter(e=>h.includes(e.catId)&&paid(e)).reduce((a,e)=>a+e.amount,0);
  const os=S.expenses.filter(e=>o.includes(e.catId)&&paid(e)).reduce((a,e)=>a+e.amount,0);
  // lekötött vagy fizetendő, de még ki nem fizetett rész kategóriánként
  let open=0; hazCats().forEach(c=>{open+=Math.max(0,committed(c.id)-spent(c.id),pending(c.id))});
  const hb=S.settings.houseBudget||0, cont=hb*(S.settings.contingencyPct||0)/100;
  const planned=hazCats().reduce((a,c)=>a+(c.budget||0),0);
  return {hs,os,open,hb,cont,planned,free:hb-hs-open,all:hs+os};
}
function projection(){
  const p=overall(), st=toD(S.settings.startDate);
  if(!st||p<3)return null;
  const el=Date.now()-st.getTime(); if(el<=0)return null;
  return new Date(st.getTime()+el*100/p);
}
function plannedEnd(){
  if(S.settings.moveInTarget)return toD(S.settings.moveInTarget);
  const ends=hazCats().map(c=>c.end).filter(Boolean).sort();
  return ends.length?toD(ends[ends.length-1]):null;
}
function statusOf(c){return c.progress>=100?['Kész','pine']:c.progress>0?['Folyamatban','oak']:['Nem kezdődött','']}
function icons(){if(window.lucide)lucide.createIcons()}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}

function backupHint(){
  const lb=S.settings.lastBackup;const days=lb?Math.floor((Date.now()-toD(lb).getTime())/864e5):null;
  if(days!==null&&days<14)return `<div class="row">Utolsó mentés: ${days===0?'ma':days+' napja'}</div>`;
  return `<div class="row" style="color:var(--oak)">${lb?'Utolsó mentés: '+days+' napja':'Még nem volt fájlmentés'}<span style="margin-left:auto"><button data-act="backup">Mentés</button></span></div>`;
}

      <rect x="48" y="104" width="34" height="28" rx="2"/><line x1="65" y1="104" x2="65" y2="132"/>

    <line x1="4" y1="168" x2="216" y2="168" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
  </svg>`;
}
function moneyBar(budget,sp,cm){
  const base=Math.max(budget,sp,cm,1);
  const s=Math.min(sp,budget||sp)/base*100, c=Math.max(0,Math.min(cm,budget||cm)-sp)/base*100, o=budget&&Math.max(sp,cm)>budget?(Math.max(sp,cm)-budget)/base*100:0;
  return `<div class="bar"><i class="m-spent" style="width:${s}%;background:var(--pine)"></i><i style="width:${c}%;background:repeating-linear-gradient(135deg,var(--oak) 0 4px,var(--oak-soft) 4px 7px)"></i><i style="width:${o}%;background:var(--danger)"></i></div>`;
}

      </div>

    const rows=[['Szolgáltató',u.provider],['Felhasználó azonosító',u.customerId],['Mérő / POD',u.meterId],['Szerződésszám',u.contractNo],['Ügyintéző',u.contact],['Telefon',u.phone],['Megjegyzés',u.note]].filter(r=>r[1]);
    return `<div class="util"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">${esc(u.type)}</b><span class="chip ${stc}">${esc(u.status)}</span><button class="icon-btn" data-act="edit-util" data-id="${u.id}" aria-label="Szerkesztés"><i data-lucide="pencil"></i></button></div>
    ${rows.length?`<dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`:'<div class="small muted" style="margin-top:8px">Még nincs adat. A ceruzával töltheted ki.</div>'}</div>`}).join('')}</div></div>`;
}

/* ---------- adattár ---------- */
function fieldVal(k,v){
  const e=esc(v);
  if(/telefon/i.test(k)&&/[\d]{6,}/.test(v.replace(/\D/g,'')))return `<a href="tel:${esc(v.replace(/[^\d+]/g,''))}">${e}</a>`;
  if(/e-?mail/i.test(k)&&v.includes('@'))return `<a href="mailto:${e}">${e}</a>`;
  if(/^https?:\/\//i.test(v))return `<a href="${e}" target="_blank" rel="noopener">${e}</a>`;
  if(/^(www\.)?[a-z0-9-]+\.[a-z]{2,}(\/\S*)?$/i.test(v))return `<a href="https://${e.replace(/^https?:\/\//,'')}" target="_blank" rel="noopener">${e}</a>`;
  return e;
}
function recCard(r){
  const t=recType(r.type), filled=(r.fields||[]).filter(f=>f.v&&String(f.v).trim());
  const stc=r.status==='Bekötve'?'pine':r.status&&r.status!=='Nincs elindítva'?'oak':'';
  return `<div class="rec"><div class="rec-head"><span class="mini-ico" style="--c:${t.color}"><i data-lucide="${t.icon}"></i></span><div style="flex:1;min-width:0"><b>${esc(r.title||r.type)}</b><span class="small muted">${esc(r.type)}</span></div>${r.status?`<span class="chip ${stc}">${esc(r.status)}</span>`:''}<button class="icon-btn" data-act="edit-rec" data-id="${r.id}" aria-label="Szerkesztés"><i data-lucide="pencil"></i></button></div>
    ${filled.length?`<dl>${filled.map(f=>`<dt>${esc(f.k)}</dt><dd><span>${fieldVal(f.k,String(f.v))}</span><button class="icon-btn cp" data-copy="${esc(f.v)}" aria-label="Másolás" title="Másolás"><i data-lucide="copy"></i></button></dd>`).join('')}</dl>`:'<div class="small muted" style="margin-top:10px">Még nincs kitöltve. A ceruzával töltheted ki.</div>'}
    ${r.note?`<div class="rnote">${esc(r.note)}</div>`:''}</div>`;
}
function recMatch(r){
  if(recT&&r.type!==recT)return false;
  if(!recQ)return true;
  const q=recQ.toLowerCase();
  return [r.title,r.type,r.note,...(r.fields||[]).flatMap(f=>[f.k,f.v])].some(x=>String(x||'').toLowerCase().includes(q));
}
function recListHTML(){
  const list=(S.records||[]).filter(recMatch);
  if(!list.length)return `<div class="panel empty">${recQ||recT?'Nincs találat.':'Még nincs adatlap. Az „Új adatlap” gombbal vehetsz fel szolgáltatót, szerződést, helyrajzi számot.'}</div>`;
  return Object.keys(REC_TYPES).filter(t=>list.some(r=>r.type===t)).map(t=>`<div class="rec-group"><span class="mini-ico" style="--c:${REC_TYPES[t].color};width:22px;height:22px;border-radius:7px"><i data-lucide="${REC_TYPES[t].icon}"></i></span>${t}</div><div class="rec-grid">${list.filter(r=>r.type===t).map(recCard).join('')}</div>`).join('');
}
function renderRecords(){
  return `<div class="page-head"><div><h1>Adattár</h1><p class="sub">Szerződések, azonosítók, helyrajzi számok, elérhetőségek. Ügyintézéshez minden egy helyen.</p></div><button class="btn primary" data-act="add-rec"><i data-lucide="plus"></i>Új adatlap</button></div>
  <input class="inp" id="rec-q" placeholder="Keresés: pl. MVM, mérő, 60268, kötvényszám…" value="${esc(recQ)}" style="font-size:15px;padding:12px 14px">
  <div class="chips"><button data-rect="" class="${recT===''?'on':''}">Mind</button>${Object.keys(REC_TYPES).map(t=>`<button data-rect="${t}" class="${recT===t?'on':''}">${t}</button>`).join('')}</div>
  <div id="rec-list">${recListHTML()}</div>
  <p class="small muted" style="margin-top:18px">Tipp: a másolás ikonnal egy érintéssel vágólapra teheted az adatot, a telefonszámra koppintva pedig rögtön hívhatod.</p>`;
}
function renderRecordsPanel(type){
  const list=(S.records||[]).filter(r=>r.type===type);
  return `<div class="panel" style="grid-column:1/-1"><div class="panel-head"><h2>Közmű adatlapok</h2><div style="display:flex;gap:8px"><button class="btn sm ghost" data-go="adattar">Adattár</button><button class="btn sm" data-act="add-rec" data-type="${type}"><i data-lucide="plus"></i>Új</button></div></div>
  ${list.length?`<div class="rec-grid">${list.map(recCard).join('')}</div>`:'<div class="empty">Még nincs közmű adatlap.</div>'}</div>`;
}
function recModal(r,presetType){
  const ed=!!r; r=r?JSON.parse(JSON.stringify(r)):{type:presetType||'Közmű',title:'',status:'',note:'',fields:presetFields(presetType||'Közmű')};
  let fields=r.fields||[], type=r.type;
  const fieldsHTML=()=>fields.map((f,i)=>`<div class="fld"><input class="inp" data-fl="${i}" value="${esc(f.k)}" placeholder="Mező neve"><input class="inp" data-fv="${i}" value="${esc(f.v)}" placeholder="Érték"><button type="button" class="icon-btn" data-fdel="${i}" aria-label="Mező törlése"><i data-lucide="x"></i></button></div>`).join('');
  modal(`<h3>${ed?'Adatlap szerkesztése':'Új adatlap'}</h3>
    <div class="form-grid">
      <label class="f full">Megnevezés<input class="inp" id="r-title" value="${esc(r.title)}" placeholder="pl. Áram – E.ON, Magánút 1, Lakásbiztosítás" autofocus></label>
      <label class="f">Típus<select class="inp" id="r-type">${Object.keys(REC_TYPES).map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select></label>
      <label class="f" id="r-st-l" ${type==='Közmű'?'':'hidden'}>Állapot<select class="inp" id="r-status"><option value="">–</option>${UTIL_STATUS.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></label>
    </div>
    <div class="small muted" style="margin:16px 0 2px"><b>Adatok</b> (az üresen hagyott mezők nem jelennek meg a kártyán)</div>
    <div id="r-fields">${fieldsHTML()}</div>
    <button type="button" class="btn sm" id="r-add" style="margin-top:10px"><i data-lucide="plus"></i>Új mező</button>
    <label class="f" style="margin-top:14px">Megjegyzés<textarea class="inp" id="r-note" placeholder="pl. ügyfélszolgálati nyitvatartás, amit a legutóbbi híváskor mondtak">${esc(r.note||'')}</textarea></label>
    <div class="modal-foot">${ed?'<button class="btn danger ghost" data-m="del" style="margin-right:auto">Törlés</button>':''}<button class="btn" data-m="cancel">Mégse</button><button class="btn primary" data-m="save">Mentés</button></div>`,
  bd=>{const q=s=>bd.querySelector(s);readF(bd);
    const rec={type,title:q('#r-title').value.trim(),status:type==='Közmű'?q('#r-status').value:'',note:q('#r-note').value.trim(),fields:fields.filter(f=>(f.k||'').trim()||(f.v||'').trim()).map(f=>({k:f.k.trim(),v:f.v.trim()}))};
    if(!rec.title){toast('Adj nevet az adatlapnak');return false}
    if(ed)Object.assign(S.records.find(x=>x.id===r.id)||{},rec);else S.records.push({id:uid(),...rec});
    save();render();toast('Adatlap mentve');},
  bd=>{
    const box=bd.querySelector('#r-fields');
    window.readF=b=>{fields=fields.map((f,i)=>({k:b.querySelector(`[data-fl="${i}"]`)?.value??f.k,v:b.querySelector(`[data-fv="${i}"]`)?.value??f.v}))};
    const repaint=()=>{box.innerHTML=fieldsHTML();icons()};
    bd.querySelector('#r-add').onclick=()=>{readF(bd);fields.push({k:'',v:''});repaint();box.querySelector(`[data-fl="${fields.length-1}"]`).focus()};
    box.addEventListener('click',e=>{const d=e.target.closest('[data-fdel]');if(!d)return;readF(bd);fields.splice(+d.dataset.fdel,1);repaint()});
    bd.querySelector('#r-type').onchange=e=>{readF(bd);type=e.target.value;bd.querySelector('#r-st-l').hidden=type!=='Közmű';
      const have=new Set(fields.filter(f=>f.v).map(f=>f.k));fields=fields.filter(f=>f.v).concat(recType(type).fields.filter(k=>!have.has(k)).map(k=>({k,v:''})));repaint()};
    bd.querySelector('[data-m="del"]')?.addEventListener('click',()=>confirmBox('Biztosan törlöd ezt az adatlapot?',()=>{S.records=S.records.filter(x=>x.id!==r.id);save();render()}));
  });
}

/* ---------- PDF kivonat (nyomtatás → Mentés PDF-ként) ---------- */
const nowStr=()=>new Date().toLocaleString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const dts=ms=>ms?new Date(ms).toLocaleString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'–';
function prHead(title,sub){return `<div class="pr-head"><div><div class="pr-brand">ÁLOMHÁZ</div><h1>${esc(title)}</h1><div class="pr-sub">${esc(sub||'')}</div></div><div class="pr-meta">Készült: ${nowStr()}<br>Készítette: ${esc(ME)}<br>${esc(S.settings.project||'')}</div></div>`}
function prExpTable(list,showCat){
  list=[...list].sort((a,b)=>((paid(a)?a.date:a.due)||'').localeCompare((paid(b)?b.date:b.due)||''));
  const pd=list.filter(paid).reduce((s,e)=>s+e.amount,0), pn=list.filter(e=>!paid(e)).reduce((s,e)=>s+e.amount,0);
  if(!list.length)return '<p>Nincs kiadás.</p>';
  return `<table><thead><tr><th>Fizetés dátuma</th><th>Megnevezés</th>${showCat?'<th>Témakör</th>':''}<th>Fizette</th><th>Állapot</th><th class="r">Tervezett</th><th class="r">Összeg</th><th>Megjegyzés</th><th>Rögzítve</th></tr></thead><tbody>
  ${list.map(e=>`<tr><td>${paid(e)?fd(e.date):(e.due?'határidő: '+fd(e.due):'–')}</td><td>${esc(e.desc||'')}</td>${showCat?`<td>${esc((cat(e.catId)||{}).name||'')}</td>`:''}<td>${esc(e.paidBy||'')}</td><td>${paid(e)?'Fizetve':'Fizetendő'}</td><td class="r">${e.planned?ft(e.planned):''}</td><td class="r">${ft(e.amount)}</td><td>${esc(e.note||'')}</td><td>${dts(e.created)}${e.by?', '+esc(e.by):''}</td></tr>`).join('')}
  <tr class="tot"><td colspan="${showCat?6:5}">Kifizetve összesen${pn?' / még fizetendő':''}</td><td class="r">${ft(pd)}${pn?'<br>'+ft(pn):''}</td><td colspan="2"></td></tr></tbody></table>`;
}
function prCat(id){
  const c=cat(id),sp=spent(id),cm=committed(id),pn=pending(id),rem=(c.budget||0)-Math.max(sp,cm,sp+pn);
  const qs=S.quotes.filter(q=>q.catId===id), tasks=S.tasks.filter(t=>t.catId===id&&!t.done);
  return prHead(c.name,(c.scope==='haz'?'A házkeret része':'Házkereten kívüli tétel')+(c.contractor?' · Kivitelező: '+c.contractor:'')+' · Készültség: '+c.progress+'%')
   +`<div class="pr-sum"><div><span>Keret</span><b>${c.budget?ft(c.budget):'–'}</b></div><div><span>Kifizetve</span><b>${ft(sp)}</b></div><div><span>Lekötve (ajánlat)</span><b>${ft(cm)}</b></div><div><span>Fizetendő</span><b>${ft(pn)}</b></div><div><span>Maradék</span><b>${c.budget?ft(rem):'–'}</b></div></div>`
   +`<h2>Kiadások</h2>${prExpTable(S.expenses.filter(e=>e.catId===id))}`
   +(qs.length?`<h2>Árajánlatok</h2><table><thead><tr><th>Megnevezés</th><th>Dátum</th><th>Állapot</th><th class="r">Összeg</th><th>Tartalom</th></tr></thead><tbody>${qs.map(q=>`<tr><td>${esc(q.vendor)}</td><td>${fd(q.date)}</td><td>${esc(q.status)}</td><td class="r">${ft(q.amount)}</td><td>${esc(q.note||'')}</td></tr>`).join('')}</tbody></table>`:'')
   +(tasks.length?`<h2>Nyitott teendők</h2><table><thead><tr><th>Teendő</th><th>Határidő</th><th>Ki intézi</th><th>Megjegyzés</th></tr></thead><tbody>${tasks.map(t=>`<tr><td>${esc(t.title)}</td><td>${fd(t.due)}</td><td>${esc(t.who||'')}</td><td>${esc(t.note||'')}</td></tr>`).join('')}</tbody></table>`:'');
}
function prExp(){
  let list=[...S.expenses];if(filt.cat)list=list.filter(e=>e.catId===filt.cat);if(filt.who)list=list.filter(e=>e.paidBy===filt.who);
  const sub=[filt.cat?(cat(filt.cat)||{}).name:'Minden témakör',filt.who||'mindenki'].join(' · ');
  const by=p=>list.filter(e=>paid(e)&&e.paidBy===p).reduce((s,e)=>s+e.amount,0);
  return prHead('Kiadások kivonata',sub)+`<div class="pr-sum"><div><span>Bence fizette</span><b>${ft(by('Bence'))}</b></div><div><span>Ancsi fizette</span><b>${ft(by('Ancsi'))}</b></div><div><span>Közös</span><b>${ft(by('Közös'))}</b></div><div><span>Tételek</span><b>${list.length} db</b></div><div><span>Kifizetve összesen</span><b>${ft(list.filter(paid).reduce((s,e)=>s+e.amount,0))}</b></div></div>`+prExpTable(list,true);
}
function prAll(){
  const t=totals();
  return prHead('Projekt összesítő','Készültség: '+Math.round(overall())+'% · Házkeret: '+ft(t.hb))
   +`<div class="pr-sum"><div><span>Elköltve a házra</span><b>${ft(t.hs)}</b></div><div><span>Lekötve / fizetendő</span><b>${ft(t.open)}</b></div><div><span>Szabad keret</span><b>${ft(t.free)}</b></div><div><span>Kereten kívül (telek stb.)</span><b>${ft(t.os)}</b></div><div><span>Teljes projekt</span><b>${ft(t.all)}</b></div></div>`
   +`<h2>Témakörök</h2><table><thead><tr><th>Témakör</th><th class="r">Keret</th><th class="r">Kifizetve</th><th class="r">Lekötve</th><th class="r">Fizetendő</th><th class="r">Készültség</th></tr></thead><tbody>${S.cats.map(c=>`<tr><td>${esc(c.name)}${c.scope!=='haz'?' <span style="color:#888">(kereten kívül)</span>':''}</td><td class="r">${c.budget?ft(c.budget):'–'}</td><td class="r">${ft(spent(c.id))}</td><td class="r">${ft(committed(c.id))}</td><td class="r">${ft(pending(c.id))}</td><td class="r">${c.progress}%</td></tr>`).join('')}
   <tr class="tot"><td>Összesen</td><td class="r">${ft(S.cats.reduce((s,c)=>s+(c.budget||0),0))}</td><td class="r">${ft(t.all)}</td><td class="r">${ft(S.cats.reduce((s,c)=>s+committed(c.id),0))}</td><td class="r">${ft(S.cats.reduce((s,c)=>s+pending(c.id),0))}</td><td class="r">${Math.round(overall())}%</td></tr></tbody></table>`
   +`<h2>Összes kiadás</h2>${prExpTable(S.expenses,true)}`;
}
function printReport(kind,id){
  const html=(kind==='cat'?prCat(id):kind==='exp'?prExp():prAll())+`<div class="pr-foot">Álomház építési napló · ${nowStr()}</div>`;
  const el=document.getElementById('print');el.innerHTML=html;
  const old=document.title, nm=kind==='cat'?(cat(id)||{}).name:kind==='exp'?'Kiadasok':'Osszesito';
  document.title='Alomhaz - '+nm+' - '+today();
  const done=()=>{document.title=old;el.innerHTML='';window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),60);
}

/* ---------- expenses page ---------- */
function renderExpenses(){
  let ex=[...S.expenses];
  if(filt.cat)ex=ex.filter(e=>e.catId===filt.cat);
  if(filt.who)ex=ex.filter(e=>e.paidBy===filt.who);
  ex.sort((a,b)=>b.date.localeCompare(a.date));
  const sum=ex.filter(paid).reduce((a,e)=>a+e.amount,0);
  const groups={};ex.forEach(e=>{const k=(paid(e)?e.date:(e.due||e.date)).slice(0,7);(groups[k]=groups[k]||[]).push(e)});
  return `<div class="page-head"><div><h1>Kiadások</h1><p class="sub">${ex.length} tétel, kifizetve összesen ${ft(sum)}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="pdf" data-kind="exp"><i data-lucide="printer"></i>PDF kivonat</button><button class="btn primary" data-act="add-expense"><i data-lucide="plus"></i>Új kiadás</button></div>
  <div class="panel">
    <div class="form-grid" style="margin-bottom:6px">
      <select class="inp" data-filter="cat"><option value="">Minden témakör</option>${S.cats.map(c=>`<option value="${c.id}" ${filt.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      <select class="inp" data-filter="who"><option value="">Mindenki</option>${PEOPLE.map(p=>`<option ${filt.who===p?'selected':''}>${p}</option>`).join('')}</select>
    </div>
    ${Object.keys(groups).length?Object.entries(groups).map(([k,list])=>`<div class="month-h"><span>${toD(k+'-15').toLocaleDateString('hu-HU',{year:'numeric',month:'long'})}</span><span>${ft(list.filter(paid).reduce((a,e)=>a+e.amount,0))}</span></div>${list.map(expRow).join('')}`).join(''):'<div class="empty" style="margin-top:10px">Nincs a szűrésnek megfelelő kiadás.</div>'}

/* ---------- quotes page ---------- */

/* ---------- settlement ---------- */
function renderSettle(){
  const by=p=>S.expenses.filter(e=>e.paidBy===p&&paid(e)).reduce((a,e)=>a+e.amount,0);
  const b=by('Bence'),a=by('Ancsi'),k=by('Közös'),pers=a+b||1;
  return `<div class="page-head"><div><h1>Elszámolás</h1><p class="sub">Ki mennyit tett bele a közös projektbe</p></div></div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div><span class="who who-Bence">Bence</span><div class="kpi-big" style="font-size:30px">${ft(b)}</div><span class="small muted">${Math.round(b/pers*100)}% a saját befizetésekből</span></div>
      <div style="text-align:right"><span class="who who-Ancsi">Ancsi</span><div class="kpi-big" style="font-size:30px">${ft(a)}</div><span class="small muted">${Math.round(a/pers*100)}% a saját befizetésekből</span></div>
    </div>
    <div class="split-bar"><i style="width:${b/pers*100}%;background:var(--pine)"></i><i style="width:${a/pers*100}%;background:var(--oak)"></i></div>
    <p class="small muted" style="margin:0">Közös kasszából fizetve: <b style="color:var(--ink)">${ft(k)}</b>. Ezt külön tartja nyilván, nem osztja szét kettőtök között.</p>

/* ---------- funding ---------- */
function fundCalc(){
  const F=S.funding||[], t=totals();
  const inc=F.filter(f=>f.status==='Megérkezett').reduce((a,f)=>a+fAmt(f),0);
  const exp=F.filter(f=>f.status!=='Megérkezett').reduce((a,f)=>a+fAmt(f),0);
  const loans=F.filter(f=>f.kind==='kolcson');
  const repaid=loans.filter(f=>f.repaid).reduce((a,f)=>a+f.amount,0);
  const toRepay=loans.filter(f=>!f.repaid).reduce((a,f)=>a+f.amount,0);
  const cash=inc-t.all-repaid;
  const houseLeft=Math.max(0,t.hb-t.hs);
  const otherPending=S.expenses.filter(e=>!paid(e)&&(cat(e.catId)||{}).scope!=='haz').reduce((a,e)=>a+e.amount,0);
  const need=houseLeft+otherPending+toRepay, have=cash+exp;
  return {inc,exp,repaid,toRepay,spent:t.all,cash,houseLeft,otherPending,need,have,balance:have-need};
}

  return `<div class="li"><div class="mini-ico" style="--c:${FUND_COLORS[f.type]||'#5C7A72'}"><i data-lucide="${FUND_ICON[f.type]||'wallet'}"></i></div><div class="grow"><div class="t">${esc(f.name)}</div><div class="s" style="white-space:normal">${sub.map(esc).join(', ')}</div></div>${right}<span class="amt">${ft(fAmt(f))}</span><button class="icon-btn" data-act="edit-fund" data-id="${f.id}" aria-label="Szerkesztés"><i data-lucide="pencil"></i></button></div>`;

  const m=document.getElementById('main');
  m.innerHTML=view==='dash'?renderDash():view.startsWith('cat:')?renderCat(view.slice(4)):view==='kiadasok'?renderExpenses():view==='ajanlatok'?renderQuotes():view==='elszamolas'?renderSettle():view==='teendok'?renderTasks():view==='finansz'?renderFunding():view==='temakorok'?renderCatsEditor():view==='adattar'?renderRecords():renderSettings();

}

function closeMenu(){document.getElementById('side').classList.remove('open');document.querySelector('.scrim')?.remove()}

/* ---------- modals ---------- */
function modal(html,onSave,mount){
  const L=document.getElementById('layer');
  L.innerHTML=`<div class="backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const bd=L.firstElementChild;icons();
  bd.addEventListener('click',e=>{if(e.target===bd||e.target.closest('[data-m="cancel"]'))L.innerHTML=''});
  bd.querySelector('[data-m="save"]')?.addEventListener('click',()=>{if(onSave(bd)!==false)L.innerHTML=''});
  mount&&mount(bd);
  const first=bd.querySelector('[autofocus]');first&&setTimeout(()=>first.focus(),50);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g&&!e.target.closest('[data-act]')){go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='menu'){const sd=document.getElementById('side');sd.classList.add('open');const s=document.createElement('div');s.className='scrim';s.onclick=closeMenu;document.body.appendChild(s);return}
    if(act==='add-expense')return expenseModal(null,a.dataset.cat);
    if(act==='edit-expense')return expenseModal(S.expenses.find(x=>x.id===a.dataset.id));
    if(act==='add-quote')return quoteModal(null,a.dataset.cat);
    if(act==='edit-quote')return quoteModal(S.quotes.find(x=>x.id===a.dataset.id));
    if(act==='add-util')return utilModal();
    if(act==='add-rec')return recModal(null,a.dataset.type);
    if(act==='edit-rec')return recModal((S.records||[]).find(x=>x.id===a.dataset.id));
    if(act==='pdf')return printReport(a.dataset.kind,a.dataset.id);
    if(act==='edit-cat')return catModal(cat(a.dataset.id));
    if(act==='add-cat')return catModal(null,a.dataset.scope);
    if(act==='edit-task')return taskModal(S.tasks.find(x=>x.id===a.dataset.id));
    if(act==='cat-up'||act==='cat-down')return moveCat(a.dataset.id,act==='cat-up'?-1:1);
    if(act==='add-fund')return fundModal(null,a.dataset.kind);
    if(act==='edit-fund')return fundModal(S.funding.find(x=>x.id===a.dataset.id));
    if(act==='edit-util')return utilModal(S.utilities.find(x=>x.id===a.dataset.id));
    if(act==='add-task'){const t=document.getElementById('nt-title').value.trim();if(!t){toast('Írd be a teendőt');return}
      const cs=document.getElementById('nt-cat'),nn=document.getElementById('nt-note');
      S.tasks.push(tk(cs?cs.value:view.slice(4),t,false,document.getElementById('nt-due').value,document.getElementById('nt-who').value.trim()||ME,nn?nn.value.trim():''));save();render();return}
    if(act==='auto-split'){const h=hazCats();const pool=(S.settings.houseBudget||0)*(1-(S.settings.contingencyPct||0)/100);const sh=h.reduce((x,c)=>x+c.share,0);
      const doIt=()=>{h.forEach(c=>c.budget=Math.round(pool*c.share/sh/100000)*100000);save();render();toast('Keretek felosztva')};
      return h.some(c=>c.budget)?confirmBox('A meglévő témakör-kereteket felülírja. Folytatod?',doIt,'Felülírás'):doIt()}
    if(act==='backup'){const d={exportedAt:new Date().toISOString()};COLLS.forEach(c=>d[c]=S[c]);d.settings=S.settings;
      const blob=new Blob([JSON.stringify(d,null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');
      l.href=u;l.download='alomhaz-mentes-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
      S.settings.lastBackup=today();save();render();toast('Mentés letöltve');return}
    if(act==='restore'){const fi=document.getElementById('restore-file');fi.value='';fi.onchange=()=>{const file=fi.files[0];if(!file)return;const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.cats))throw 0;confirmBox('A visszatöltés minden jelenlegi adatot felülír, Ancsinál és nálad is. Folytatod?',()=>{APP.importData(d);toast('Adatok visszatöltve')},'Visszatöltés')}catch(x){toast('Ez nem érvényes mentésfájl')}};r.readAsText(file)};fi.click();return}
    if(act==='logout')return confirmBox('Kijelentkezel?',()=>Backend.logout(),'Kilépés');
    if(act==='change-pw'){const c=document.getElementById('pw-cur').value,n=document.getElementById('pw-new').value,n2=document.getElementById('pw-new2').value;
      if(!c||!n){toast('Töltsd ki a jelszómezőket');return}if(n.length<6){toast('Az új jelszó legalább 6 karakter legyen');return}if(n!==n2){toast('A két új jelszó nem egyezik');return}
      Backend.changePassword(c,n).then(()=>{['pw-cur','pw-new','pw-new2'].forEach(x=>document.getElementById(x).value='');toast('Jelszó módosítva')}).catch(err=>toast(err&&err.code==='auth/invalid-credential'||err&&err.code==='auth/wrong-password'?'A jelenlegi jelszó nem jó':'Nem sikerült módosítani'));return}
    return;
  }
  const qa=e.target.closest('[data-q-acc]');
  if(qa){const q=S.quotes.find(x=>x.id===qa.dataset.qAcc);q.status='Elfogadva';save();render();toast('Ajánlat elfogadva, lekötött keretként számol');return}
  const td=e.target.closest('[data-task-del]');
  if(td){return confirmBox('Biztosan törlöd ezt a teendőt?',()=>{S.tasks=S.tasks.filter(t=>t.id!==td.dataset.taskDel);save();render()})}
  const cpb=e.target.closest('[data-copy]');
  if(cpb){const v=cpb.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Másolva: '+v)).catch(()=>toast('A másolás nem sikerült'));return}
  const rt=e.target.closest('[data-rect]');
  if(rt){recT=rt.dataset.rect;render();return}
  const da=e.target.closest('[data-ded-add]');
  if(da){S.funding.find(x=>x.id===da.dataset.dedAdd).sale.deductions.push({id:uid(),name:'Új levonás',amount:0,settled:false});save();render();return}
  const dd=e.target.closest('[data-ded-del]');
  if(dd){const s=S.funding.find(x=>x.id===dd.dataset.fid).sale;return confirmBox('Biztosan törlöd ezt a levonást?',()=>{s.deductions=s.deductions.filter(x=>x.id!==dd.dataset.dedDel);save();render()})}
  const rp=e.target.closest('[data-repay]');
  if(rp){const x=S.funding.find(v=>v.id===rp.dataset.repay);x.repaid=true;x.repaidDate=today();save();render();toast('Kölcsön visszafizetettnek jelölve');return}
  const py=e.target.closest('[data-pay]');
  if(py){const x=S.expenses.find(v=>v.id===py.dataset.pay);x.status='Fizetve';x.date=today();save();render();toast('Kifizetettnek jelölve');return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.taskToggle){const k=S.tasks.find(x=>x.id===t.dataset.taskToggle);k.done=t.checked;k.doneDate=t.checked?today():'';save();render();return}
  if(t.dataset.catRange){cat(t.dataset.catRange).progress=+t.value;save();render();return}
  if(t.dataset.money){cat(t.dataset.money).budget=amt(t.value);save();render();return}
  if(t.dataset.f){cat(view.slice(4))[t.dataset.f]=t.value;save();if(['start','end','contractor'].includes(t.dataset.f))renderSide(),icons();return}
  if(t.dataset.set){S.settings[t.dataset.set]=t.type==='number'?+t.value:t.value;save();return}
  if(t.dataset.sale){const f=S.funding.find(x=>x.id===t.dataset.fid),k=t.dataset.sale;
    f.sale[k]=['investName','investDate'].includes(k)?t.value:(k.endsWith('Pct')?(parseFloat(String(t.value).replace(',','.'))||0):amt(t.value));save();render();return}
  if(t.dataset.saleStatus){S.funding.find(x=>x.id===t.dataset.saleStatus).status=t.value;save();render();return}
  if(t.dataset.saleInv){S.funding.find(x=>x.id===t.dataset.saleInv).sale.invested=t.checked;save();render();return}
  if(t.dataset.ded){const d=S.funding.find(x=>x.id===t.dataset.fid).sale.deductions.find(x=>x.id===t.dataset.did),k=t.dataset.ded;
    d[k]=k==='settled'?t.checked:k==='amount'?amt(t.value):t.value;save();render();return}
  if(t.dataset.setMoney){S.settings[t.dataset.setMoney]=amt(t.value);save();return}
  if(t.dataset.filter){filt[t.dataset.filter]=t.value;render();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='rec-q'){recQ=t.value;const l=document.getElementById('rec-list');if(l){l.innerHTML=recListHTML();icons()}return}
  if(t.dataset.catRange){document.getElementById('pv').textContent=t.value+'%'}
  if((t.dataset.sale&&!/Pct$|investName|investDate/.test(t.dataset.sale))||t.dataset.ded==='amount'){const v=amt(t.value);t.value=v?nf.format(v):''}
  if(t.dataset.money!==undefined||t.dataset.setMoney!==undefined){const v=amt(t.value);t.value=v?nf.format(v):''}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('layer').innerHTML='';if(e.key==='Enter'&&e.target.id==='nt-title')document.querySelector('[data-act="add-task"]').click()});
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

<div class="login" id="login" hidden>
  <div class="login-card">
    <div class="brand-mark"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
    <h1>Álomház</h1><p class="sub">Lépj be a saját fiókoddal</p>
    <form id="login-form">
      <label class="f">E-mail<input class="inp" type="email" id="li-email" autocomplete="username" required></label>
      <label class="f">Jelszó<input class="inp" type="password" id="li-pw" autocomplete="current-password" required></label>
      <div class="login-err" id="li-err"></div>
      <button class="btn primary" type="submit" style="justify-content:center;padding:11px">Belépés</button>
      <button class="linkbtn" type="button" id="li-forgot">Elfelejtettem a jelszavam</button>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqa48WA4RB820Ql3C9QTjNNA_PDR_cZ9g",
  authDomain: "alomhaz-a8ca0.firebaseapp.com",
  projectId: "alomhaz-a8ca0",
  storageBucket: "alomhaz-a8ca0.firebasestorage.app",
  messagingSenderId: "674012650771",
  appId: "1:674012650771:web:86f57e8a98e9c3195e0ee6"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { db = initializeFirestore(app, {}); }

const ROOT = ['projektek', 'alomhaz'];
const col = c => collection(db, ...ROOT, c);
const settingsRef = () => doc(db, ...ROOT, 'meta', 'settings');
let unsubs = [], pending = 0;
const track = p => { pending++; APP.setStatus(navigator.onLine ? 'pending' : 'offline');
  p.then(() => { pending--; if (!pending) APP.setStatus(navigator.onLine ? 'ok' : 'offline'); })
   .catch(err => { pending--; console.error(err); APP.setStatus('error'); }); };

window.Backend = {
  put: (c, id, data) => track(setDoc(doc(db, ...ROOT, c, id), data)),
  del: (c, id) => track(deleteDoc(doc(db, ...ROOT, c, id))),
  putSettings: data => track(setDoc(settingsRef(), data)),
  logout: () => signOut(auth).then(() => location.reload()),
  changePassword: async (cur, next) => {
    const u = auth.currentUser;
    await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, cur));
    await updatePassword(u, next);
  }
};
addEventListener('online', () => APP.setStatus(pending ? 'pending' : 'ok'));
addEventListener('offline', () => APP.setStatus('offline'));

async function start(user) {
  window.CURRENT_EMAIL = user.email;
  try {
    const [cs, st] = await Promise.all([getDocs(col('cats')), getDoc(settingsRef())]);
    if (cs.empty && !st.exists()) APP.seedAll();
  } catch (e) {
    if (e && e.code === 'permission-denied') { showLogin('Ehhez a fiókhoz nincs hozzáférés.'); signOut(auth); return; }
    console.warn('Első betöltés gyorsítótárból', e);
  }
  let first = new Set();
  const done = name => { first.add(name); if (first.size === 8) APP.ready(user.email); };
  ['cats','expenses','quotes','tasks','funding','utilities','records'].forEach(c => {
    unsubs.push(onSnapshot(col(c), snap => { APP.applyRemote(c, snap.docs.map(d => d.data())); done(c); },
      err => { console.error(err); APP.setStatus('error'); done(c); }));
  });
  unsubs.push(onSnapshot(settingsRef(), s => { if (s.exists()) APP.applySettings(s.data()); done('settings'); },
    err => { console.error(err); done('settings'); }));
}

const L = document.getElementById('login');
function showLogin(msg) { L.hidden = false; document.getElementById('li-err').textContent = msg || ''; }
onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  if (user) { L.hidden = true; start(user); } else showLogin();
});
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const em = document.getElementById('li-email').value.trim(), pw = document.getElementById('li-pw').value;
  document.getElementById('li-err').textContent = '';
  try { await signInWithEmailAndPassword(auth, em, pw); }
  catch (err) { document.getElementById('li-err').textContent = err.code === 'auth/too-many-requests' ? 'Túl sok próbálkozás, várj pár percet.' : err.code === 'auth/network-request-failed' ? 'Nincs internetkapcsolat.' : 'Hibás e-mail-cím vagy jelszó.'; }
});
document.getElementById('li-forgot').addEventListener('click', async () => {
  const em = document.getElementById('li-email').value.trim();
  if (!em) { document.getElementById('li-err').textContent = 'Előbb írd be az e-mail-címed.'; return; }
  try { await sendPasswordResetEmail(auth, em); document.getElementById('li-err').textContent = 'Elküldtük a jelszóváltoztató levelet.'; }
  catch (err) { document.getElementById('li-err').textContent = 'Nem sikerült elküldeni, ellenőrizd a címet.'; }
});
</script>
