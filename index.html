<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Álomház</title>
<meta name="theme-color" content="#2F5D50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Álomház">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#F3F5F3; --surface:#FFFFFF; --surface2:#F8FAF9; --ink:#1E2B2F; --muted:#69767A; --line:#E0E5E2;
  --pine:#2F5D50; --pine-soft:#E2ECE7; --oak:#B07D48; --oak-soft:#F4EADF;
  --danger:#B4443A; --danger-soft:#F7E4E2; --ok:#3E7D5A;
  --shadow:0 1px 2px rgba(30,43,47,.06), 0 8px 24px rgba(30,43,47,.05);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121819; --surface:#1A2224; --surface2:#1F282A; --ink:#E6ECEA; --muted:#93A0A2; --line:#2A3537;
    --pine:#72B19B; --pine-soft:#1E322C; --oak:#D4A26F; --oak-soft:#382C20;
    --danger:#E07A70; --danger-soft:#3A2220; --ok:#74B98F;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121819; --surface:#1A2224; --surface2:#1F282A; --ink:#E6ECEA; --muted:#93A0A2; --line:#2A3537;
  --pine:#72B19B; --pine-soft:#1E322C; --oak:#D4A26F; --oak-soft:#382C20;
  --danger:#E07A70; --danger-soft:#3A2220; --ok:#74B98F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.lucide{width:18px;height:18px;stroke-width:1.8;flex:none}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}

.app{display:grid;grid-template-columns:268px 1fr;min-height:100%}
/* rácselemek ne nőjenek a tartalmuk miatt szélesebbre a képernyőnél */
.app>div,.hero>*,.grid2>*,.cat-grid>*,.sale-grid>*,.kpis>*,.fin>*,.form-grid>*,.stack>*,.split-cols>*{min-width:0}
.form-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
select,.inp{max-width:100%;min-width:0}
.panel-head{flex-wrap:wrap}
.panel{min-width:0;max-width:100%}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--pine);color:#fff;display:grid;place-items:center}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pine);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;margin:0 4px 14px}
.add-btn:hover{filter:brightness(1.08)}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:14px;font-weight:500}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--pine-soft);color:var(--pine);font-weight:600}
.nav-item .pct{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.nav-item.active .pct{color:var(--pine)}
.nav-group{font-size:12px;color:var(--muted);padding:16px 10px 6px;font-weight:600}
.nav-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.nav-quiet{font-size:12.5px;color:var(--muted)}
.nav-quiet svg.lucide{width:15px;height:15px}

/* Main */
.main{padding:24px 40px 80px;max-width:1240px;width:100%}
.topbar{display:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.005em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Hero */
.hero{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 34px;margin-bottom:22px}
.house{position:relative}
.house svg{width:100%;height:auto;display:block}
.house-fill{transition:y 1.4s cubic-bezier(.2,.7,.2,1),height 1.4s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.house-fill{transition:none}}
.house-pct{text-align:center;margin-top:10px}
.house-pct b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.house-pct span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.kpi-lbl{color:var(--muted);font-size:13px;font-weight:500}
.kpi-big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:4px 0 2px}
.kpi-of{color:var(--muted);font-size:14px}
.meter{height:12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:flex;margin:18px 0 10px}
.meter i{display:block;height:100%}
.meter .m-spent{background:var(--pine)}
.meter .m-comm{background:repeating-linear-gradient(135deg,var(--oak) 0 5px,var(--oak-soft) 5px 9px)}
.meter .m-over{background:var(--danger)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.kpis div b{display:block;font-size:16px;font-weight:700;margin-top:2px;white-space:nowrap}
.movein{display:flex;gap:10px;align-items:center;margin-top:18px;background:var(--pine-soft);color:var(--pine);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500}
.movein b{font-weight:700}

.grid2{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px}

/* Phase rows */
.phase{display:grid;grid-template-columns:38px minmax(150px,1.3fr) 1.4fr 72px;gap:14px;align-items:center;padding:12px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:10px}
.phase:first-of-type{border-top:0}
.phase:hover{background:var(--surface2)}
.ico,.mini-ico,.nav-ico,.pick-ico{--c:#2F5D50;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 82%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 78%,#000) 100%);
  box-shadow:0 3px 8px color-mix(in srgb,var(--c) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.28)}
.ico svg.lucide,.mini-ico svg.lucide,.nav-ico svg.lucide,.pick-ico svg.lucide{stroke-width:2.1}
.ico{width:38px;height:38px;border-radius:12px}
.phase-name{font-weight:600;font-size:14px;line-height:1.3}
.phase-meta{font-size:12px;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.money-line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px;gap:8px}
.money-line b{color:var(--ink);font-weight:600}
.over b{color:var(--danger)}
.ring{--p:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--pine) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;justify-self:end}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700}
.phase:hover .ring span{background:var(--surface2)}

/* Lists */
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.mini-ico{width:30px;height:30px;border-radius:9px}
.nav-ico{width:26px;height:26px;border-radius:8px}
.nav-ico svg.lucide{width:14px;height:14px}
.pick-ico{width:34px;height:34px;border-radius:10px}
.pick-ico svg.lucide{width:17px;height:17px}
.cat-pick button.on .pick-ico{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.mini-ico svg.lucide{width:15px;height:15px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.pine{background:var(--pine-soft);color:var(--pine);border-color:transparent}
.chip.oak{background:var(--oak-soft);color:var(--oak);border-color:transparent}
.chip.red{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.who{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px}
.who-Bence{background:var(--pine-soft);color:var(--pine)}
.who-Ancsi{background:var(--oak-soft);color:var(--oak)}
.who-Közös{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--pine)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;font-size:14px;font-weight:500;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--pine);background:var(--surface)}
textarea.inp{resize:vertical;min-height:70px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{white-space:nowrap;flex:1;border:0;background:none;border-radius:8px;padding:8px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Category page */
.cat-head{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.cat-head .ico{width:56px;height:56px;border-radius:16px}
.cat-head .ico svg.lucide{width:26px;height:26px}
.progress-panel{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.progress-panel .big{font-size:36px;font-weight:800;letter-spacing:-.03em;min-width:92px}
input[type=range]{flex:1;min-width:200px;accent-color:var(--pine);height:28px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.fin div{background:var(--surface2);border-radius:12px;padding:10px 12px}
.fin b{display:block;font-size:16px;font-weight:700}
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--pine);flex:none}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task-add{display:grid;grid-template-columns:1fr 140px 120px auto;gap:8px;margin-top:12px}
.quote{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-top:10px}
.quote.acc{border-color:var(--oak);background:var(--oak-soft)}
.quote.rej{opacity:.55}
.util{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface2)}
.util dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0;font-size:13px}
.util dt{color:var(--muted)}
.util dd{margin:0;font-weight:600;word-break:break-word}
.sale-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.wf{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.wf:first-child{border-top:0}
.wf.neg span:last-child{color:var(--danger);font-weight:600}
.wf.total{border-top:2px solid var(--ink);margin-top:4px;padding-top:10px;font-weight:800;font-size:17px}
.ded{display:grid;grid-template-columns:1fr 130px auto auto;gap:6px;align-items:center;margin-top:8px}
.ded.settled .inp{opacity:.5;text-decoration:line-through}
.ded label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.ded input[type=checkbox],.inv-toggle input{width:17px;height:17px;accent-color:var(--pine)}
.inv-toggle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:10px}
.ret{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ret b{display:block;font-size:17px;font-weight:800}
@media (max-width:1080px){.sale-grid{grid-template-columns:1fr}}
.catrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line)}
.catrow:first-of-type{border-top:0}
.catrow .mv{display:flex;flex-direction:column}
.catrow .mv .icon-btn{padding:2px}
.catrow .mv .icon-btn[disabled]{opacity:.25;cursor:default}
.catrow .nm{flex:1;min-width:0;cursor:pointer}
.catrow .nm b{font-weight:600;font-size:14px;display:block}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.icon-grid button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-grid button.on{border-color:var(--c);background:var(--c);color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;background:var(--s)}
.swatches button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--s)}
.tip{background:var(--pine-soft);color:var(--ink);border-radius:14px;padding:14px 16px;font-size:13.5px;margin-bottom:22px}
.tip b{color:var(--pine)}
.utils{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl-wrap{overflow-x:auto}
.month-h{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 4px;display:flex;justify-content:space-between}

.tl{display:grid;grid-template-columns:52px auto 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:10px}
.tl:hover{background:var(--surface2)}
.tl-date{text-align:center;line-height:1.1}
.tl-date b{display:block;font-size:17px;font-weight:800}
.tl-date span{font-size:11px;color:var(--muted)}
.tl .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){.tl{grid-template-columns:38px auto 1fr auto;gap:8px}.tl .amt{font-size:13.5px}}
.li.cmp{cursor:pointer;align-items:flex-start;border-radius:10px}
.li.cmp:hover{background:var(--surface2)}
.li.cmp .grow{min-width:0;flex:1}
.li.cmp .r1,.li.cmp .r2{display:flex;align-items:center;gap:8px;min-width:0}
.li.cmp .r1 .t{flex:1;min-width:0}
.li.cmp .r1 .amt{font-size:14px}
.li.cmp .r2{margin-top:3px}
.li.cmp .r2 .s{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--muted)}
.li.cmp .who{font-size:11px;padding:1px 7px}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:6px;padding:10px 40px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.nbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn:not(:disabled):hover{background:var(--surface2)}
.nav-title{margin-left:8px;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-saved{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ok);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.nav-saved svg.lucide{width:14px;height:14px}
.nav-saved.pending,.nav-saved.offline{color:var(--oak)}
.nav-saved.error{color:var(--danger)}
.mobile-only{display:none}
@media (max-width:820px){.navbar{padding:8px 12px;gap:8px}.mobile-only{display:grid}
  .navbar .mobile-only,.nbtn{width:42px;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);padding:0}
  .navbar svg.lucide{width:22px;height:22px}
  /* iPhone: 16px alatti betűméretű mezőnél a Safari ránagyít – ezért mobilon minden mező legalább 16px */
  input,select,textarea,.inp,select.inp,textarea.inp{font-size:16px!important}
  .amount-in{font-size:30px!important}
  html,body{overflow-x:hidden}
  .li{flex-wrap:wrap;row-gap:6px}.li>.grow{flex:1 1 55%;min-width:0}
  .kpis{grid-template-columns:1fr 1fr!important}
}
div.f{display:flex;flex-direction:column;gap:5px}div.f>span:first-child{font-size:12.5px;font-weight:600;color:var(--muted)}
.paybox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;background:var(--surface2)}
.pb-plan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:end}
.pb-sum b{display:block;font-size:18px;font-weight:800}.pb-sum .small{display:block}

function weight(c){if(c.budget>0)return c.budget;const pool=(S.settings.houseBudget||0)*(1-(S.settings.contingencyPct||0)/100)/100;return Math.max(spent(c.id),committed(c.id),(c.share||0)*pool)}
function overall(){let w=0,p=0;S.cats.forEach(c=>{const x=weight(c);w+=x;p+=x*(c.progress||0)});return w?p/w:0}
function totals(){
  const h=hazCats().map(c=>c.id), o=S.cats.filter(c=>c.scope!=='haz').map(c=>c.id);

}

const tStat=t=>t.status||(t.done?'done':'todo');

function setTStat(t,s){t.status=s;t.done=s==='done';t.doneDate=s==='done'?(t.doneDate||today()):''}
function dueInfo(due,done){if(!due)return null;const d=Math.round((toD(due)-toD(today()))/864e5);
  if(done)return {txt:fd(due),cls:''};if(d<0)return {txt:`${-d} napja lejárt`,cls:'red'};if(d===0)return {txt:'ma!',cls:'red'};if(d===1)return {txt:'holnap!',cls:'oak'};
  if(d<=7)return {txt:`még ${d} nap`,cls:'oak'};return {txt:`még ${d} nap`,cls:'pine'}}
function personColor(n){if(n==='Bence')return getComputedStyle(document.documentElement).getPropertyValue('--pine').trim()||'#2F5D50';if(n==='Ancsi')return getComputedStyle(document.documentElement).getPropertyValue('--oak').trim()||'#B07D48';
  let x=0;for(const ch of n||'')x=(x*31+ch.charCodeAt(0))>>>0;return SWATCHES[x%SWATCHES.length]}
const avatar=(n,sz=26)=>`<span class="ava" style="--c:${personColor(n)};width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px">${esc((n||'?').trim().charAt(0).toUpperCase())}</span>`;
function allPeople(){const s=new Set(['Bence','Ancsi']);S.tasks.forEach(t=>{if(t.who)s.add(t.who.trim())});return [...s]}
function allTags(){const s=new Set();S.tasks.forEach(t=>(t.tags||[]).forEach(g=>s.add(g)));return [...s].sort((a,b)=>a.localeCompare(b,'hu'))}
function taskRow(t,showCat){const c=cat(t.catId),st=tStat(t),di=dueInfo(t.due,st==='done');

function fieldVal(k,v){
  const e=esc(v);
  if(/telefon/i.test(k)&&/[\d]{6,}/.test(v.replace(/\D/g,'')))return `<a href="tel:${esc(v.replace(/[^\d+]/g,''))}">${e}</a>`;
  if(/e-?mail/i.test(k)&&v.includes('@'))return `<a href="mailto:${e}">${e}</a>`;
  if(/^https?:\/\//i.test(v))return `<a href="${e}" target="_blank" rel="noopener">${e}</a>`;
  if(/^(www\.)?[a-z0-9-]+\.[a-z]{2,}(\/\S*)?$/i.test(v))return `<a href="https://${e.replace(/^https?:\/\//,'')}" target="_blank" rel="noopener">${e}</a>`;

}

const nowStr=()=>new Date().toLocaleString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const dts=ms=>ms?new Date(ms).toLocaleString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'–';
function makePdfDoc(jsPDF,autoTable,fonts,spec){
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  doc.addFileToVFS('M-R.ttf',fonts.r);doc.addFont('M-R.ttf','M','normal');
  doc.addFileToVFS('M-B.ttf',fonts.b);doc.addFont('M-B.ttf','M','bold');
  const W=210,ML=12,MR=12,G=[47,93,80],INK=[25,30,32],MUT=[110,118,120];
  let y=14;
  doc.setFont('M','bold');doc.setFontSize(8);doc.setTextColor(...G);doc.text('ÁLOMHÁZ',ML,y);
  doc.setFont('M','normal');doc.setFontSize(7.5);doc.setTextColor(...MUT);
  doc.text(['Készült: '+spec.when,'Készítette: '+spec.who,spec.project||''].filter(Boolean),W-MR,y,{align:'right'});
  y+=7;doc.setFont('M','bold');doc.setFontSize(17);doc.setTextColor(...INK);
  const tl=doc.splitTextToSize(spec.title,W-ML-MR-62);doc.text(tl,ML,y);y+=tl.length*7;
  if(spec.sub){doc.setFont('M','normal');doc.setFontSize(9);doc.setTextColor(...MUT);const sl=doc.splitTextToSize(spec.sub,W-ML-MR);doc.text(sl,ML,y);y+=sl.length*4.5}
  y+=1;doc.setDrawColor(...G);doc.setLineWidth(0.6);doc.line(ML,y,W-MR,y);y+=5;
  if(spec.sums&&spec.sums.length){const n=spec.sums.length,gap=3,bw=(W-ML-MR-gap*(n-1))/n;
    spec.sums.forEach(([l,v],i)=>{const x=ML+i*(bw+gap);doc.setDrawColor(205,212,210);doc.setLineWidth(0.3);doc.roundedRect(x,y,bw,14,1.5,1.5);
      doc.setFont('M','normal');doc.setFontSize(7);doc.setTextColor(...MUT);doc.text(doc.splitTextToSize(l,bw-4)[0],x+2.5,y+5);
      doc.setFont('M','bold');doc.setFontSize(9.5);doc.setTextColor(...INK);doc.text(String(v),x+2.5,y+10.8)});y+=19}
  (spec.sections||[]).forEach(sec=>{
    if(y>270){doc.addPage();y=16}
    doc.setFont('M','bold');doc.setFontSize(11.5);doc.setTextColor(...G);doc.text(sec.h,ML,y+2);y+=5;
    if(!sec.body||!sec.body.length){doc.setFont('M','normal');doc.setFontSize(9);doc.setTextColor(...MUT);doc.text(sec.empty||'Nincs tétel.',ML,y+3);y+=10;return}
    const cs={};(sec.right||[]).forEach(i=>cs[i]={halign:'right',cellWidth:sec.mw||23});Object.assign(cs,sec.colStyles||{});
    autoTable(doc,{startY:y,head:[sec.head],body:sec.body,foot:sec.foot?[sec.foot]:undefined,margin:{left:ML,right:MR,top:14,bottom:14},
      styles:{font:'M',fontStyle:'normal',fontSize:7.8,cellPadding:1.6,textColor:INK,lineColor:[222,226,224],lineWidth:{bottom:0.2},overflow:'linebreak',valign:'top'},
      headStyles:{font:'M',fontStyle:'bold',fillColor:[236,243,240],textColor:G,lineWidth:{bottom:0.4},lineColor:[150,180,170]},
      footStyles:{font:'M',fontStyle:'bold',fillColor:[255,255,255],textColor:INK,lineWidth:{top:0.5},lineColor:G},
      columnStyles:cs,showFoot:'lastPage',rowPageBreak:'avoid',theme:'plain',didParseCell:d=>{if(d.section==='foot'&&(sec.right||[]).includes(d.column.index))d.cell.styles.halign='right'}});
    y=doc.lastAutoTable.finalY+8;
  });
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFont('M','normal');doc.setFontSize(7);doc.setTextColor(...MUT);
    doc.text('Álomház építési napló · '+spec.when,ML,290);doc.text(i+' / '+pages,W-MR,290,{align:'right'})}
  return doc;
}

function expSection(list,showCat,h='Kiadások'){
  list=[...list].sort((a,b)=>((paid(a)?a.date:a.due)||'').localeCompare((paid(b)?b.date:b.due)||''));
  const pd=list.filter(paid).reduce((s,e)=>s+e.amount,0),pn=list.filter(e=>!paid(e)).reduce((s,e)=>s+e.amount,0);
  const head=['Fizetés dátuma','Megnevezés',...(showCat?['Témakör / alcsoport']:[]),'Fizette','Állapot','Tervezett','Összeg','Megjegyzés','Rögzítve'];
  const off=showCat?1:0;
  const body=list.map(e=>[paid(e)?fd(e.date):(e.due?'határidő: '+fd(e.due):'–'),e.desc||'',...(showCat?[expPlace(e)]:[]),e.paidBy||'',paid(e)?'Fizetve':'Fizetendő',e.planned?ft(e.planned):'',ft(e.amount),e.note||'',dts(e.created)+(e.by?', '+e.by:'')]);
  const foot=head.map(()=>'');foot[0]='Kifizetve összesen'+(pn?' / még fizetendő':'');foot[5+off]=ft(pd)+(pn?'\n'+ft(pn):'');
  return {h,head,body,foot:list.length?foot:null,right:[4+off,5+off],empty:'Nincs kiadás.'};
}

/* ---------- funding ---------- */
const shareB=f=>f.owner==='Bence'?1:f.owner==='Ancsi'?0:((f.split??50)/100);
function fundCalc(){
  const F=(S.funding||[]).filter(f=>f.kind!=='kolcson'), t=totals();
  const got=F.filter(f=>f.status==='Megérkezett'), will=F.filter(f=>f.status!=='Megérkezett');
  const inc=got.reduce((a,f)=>a+fAmt(f),0), exp=will.reduce((a,f)=>a+fAmt(f),0);
  const houseLeft=Math.max(0,t.hb-t.hs);
  const otherPending=S.expenses.filter(e=>!paid(e)&&(cat(e.catId)||{}).scope!=='haz').reduce((a,e)=>a+e.amount,0);
  // A már kifizetett kiadások rendezve vannak – a fedezet csak a hátralévőt nézi.
  const need=houseLeft+otherPending, have=inc+exp;
  const cb=got.reduce((a,f)=>a+fAmt(f)*shareB(f),0), ca=got.reduce((a,f)=>a+fAmt(f)*(1-shareB(f)),0);
  const eb=will.reduce((a,f)=>a+fAmt(f)*shareB(f),0), ea=will.reduce((a,f)=>a+fAmt(f)*(1-shareB(f)),0);
  return {inc,exp,spent:t.all,houseLeft,otherPending,need,have,balance:have-need,cb,ca,eb,ea};
}
const ownerTxt=f=>f.owner==='Közös'?`Közös ${Math.round(f.split??50)}/${100-Math.round(f.split??50)}`:f.owner;

function saleCommHTML(s,c){const pc=String(s.commPct||0).replace('.',',');

function saleWfHTML(s,c){return `<div class="wf"><span>Eladási ár</span><span>${ft(s.price)}</span></div>

function saleInvHTML(s,c){

  ${hist.length>1?`<div class="ihist">${hist.slice(-6).reverse().map((x,i,a)=>{const prev=a[i+1];const d=prev?x.value-prev.value:0;return `<div class="sp-row" style="grid-template-columns:auto 1fr auto"><span class="muted">${fd(x.date)}</span><b style="text-align:right">${ft(x.value)}</b><span class="small" style="min-width:110px;text-align:right;color:${d>0?'var(--ok)':d<0?'var(--danger)':'var(--muted)'}">${prev?(d>=0?'+':'−')+ft(Math.abs(d)):'kezdő érték'}</span></div>`}).join('')}</div>`:''}`}
function saleSet(f,k,v){f.sale[k]=['investName','investDate'].includes(k)?v:(k.endsWith('Pct')?(parseFloat(String(v).replace(',','.'))||0):amt(v))}

/* ---------- render ---------- */
function render(){
  pendingRender=false;
  if(!READY){document.getElementById('main').innerHTML='<div class="loading">Adatok betöltése…</div>';return}
  renderSide();renderNav();
  const m=document.getElementById('main');setTimeout(()=>applyScopeLocks(m),0);
  m.innerHTML=view==='dash'?renderDash():view.startsWith('cat:')?renderCat(view.slice(4)):view==='kiadasok'?renderExpenses():view==='ajanlatok'?renderQuotes():view==='elszamolas'?renderSettle():view==='teendok'?renderTasks():view==='finansz'?renderFunding():view==='temakorok'?renderCatsEditor():view==='adattar'?renderRecords():view==='partnerek'?renderPartners():renderSettings();
  icons();applyScopeLocks(m);
  const f=m.querySelector('.house-fill');
  if(f)requestAnimationFrame(()=>requestAnimationFrame(()=>{f.setAttribute('y',f.dataset.y);f.setAttribute('height',f.dataset.h)}));
}
let navHist=['dash'],navIdx=0,lastSt='ok';
const VIEW_NAMES={dash:'Áttekintés',kiadasok:'Kiadások',ajanlatok:'Árajánlatok',partnerek:'Partnerek',teendok:'Feladatok',adattar:'Adattár',elszamolas:'Kifizetések',finansz:'Finanszírozás',beallitasok:'Beállítások',temakorok:'Témakörök'};
const viewName=v=>v.startsWith('cat:')?((cat(v.slice(4))||{}).name||'Témakör'):(VIEW_NAMES[v]||'');
function go(v,fromHist){flushSave();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(!fromHist&&v!==view){navHist=navHist.slice(0,navIdx+1);navHist.push(v);navIdx=navHist.length-1;if(navHist.length>60){navHist.shift();navIdx--}}
  view=v;closeMenu();render();window.scrollTo({top:0})}
function navBack(){if(navIdx>0){navIdx--;go(navHist[navIdx],true)}}
function navFwd(){if(navIdx<navHist.length-1){navIdx++;go(navHist[navIdx],true)}}
function renderNav(){const el=document.getElementById('navbar');if(!el)return;
  el.innerHTML=`<button class="icon-btn mobile-only" data-act="menu" aria-label="Menü"><i data-lucide="menu"></i></button>

function modal(html,onSave,mount){
  const L=document.getElementById('layer');
  L.innerHTML=`<div class="backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const bd=L.firstElementChild;icons();
  bd.addEventListener('click',e=>{if(e.target.closest('[data-m="cancel"]')||(e.target===bd&&!bd.querySelector('input,textarea,select')))L.innerHTML=''});
  const li=nextLock;nextLock=null;
  const doSave=lockAfter=>{const sb=bd.querySelector('[data-m="savelock"]');const r=onSave(bd);if(r===false)return;L.innerHTML='';if(lockAfter&&r&&typeof r==='object'){r.locked=true;flushSave();render();celebrate(sb);toast('✓ Mentve és lezárva')}};
  bd.querySelector('[data-m="save"]')?.addEventListener('click',()=>doSave(false));
  bd.querySelector('[data-m="savelock"]')?.addEventListener('click',()=>doSave(true));
  mount&&mount(bd);

    <div class="modal-foot"><button class="btn" data-m="cancel">Mégse</button><button class="btn primary done-btn" data-m="save"><span class="done-badge sm"><i data-lucide="check"></i></span>Igen, kész</button></div>`,
  bd=>{const ff=S.funding.find(x=>x.id===fid),d=bd.querySelector('#sd-d').value||today();
    Object.assign(ff.sale,{done:true,doneDate:d});ff.status='Megérkezett';ff.date=d;ff.locked=true;flushSave();render();
    setTimeout(()=>celebrate(document.querySelector('.ms-done .done-badge')),50);toast('🎉 Torda eladás kész!')});
}
function invSetupModal(fid){
  const f=S.funding.find(x=>x.id===fid),s=f.sale,c=saleCalc(s);
  modal(`<h3>Befektetés</h3><div class="form-grid">
    <label class="f full">Hol / miben<input class="inp" id="i-n" value="${esc(s.investName||'')}" placeholder="pl. állampapír, befektetési alap" autofocus></label>
    <label class="f">Befektetett összeg<input class="inp" inputmode="numeric" id="i-a" value="${nf.format(s.investAmount||Math.max(0,c.net))}"></label>
    <label class="f">Befektetés dátuma<input class="inp" type="date" id="i-d" value="${s.investDate||today()}"></label></div>
    <div class="modal-foot">${s.invested?'<button class="btn danger ghost" data-m="del" style="margin-right:auto">Befektetés törlése</button>':''}<button class="btn" data-m="cancel">Mégse</button><button class="btn primary" data-m="save">Mentés</button></div>`,
  bd=>{const ff=S.funding.find(x=>x.id===fid),ss=ff.sale,a=amt(bd.querySelector('#i-a').value),d=bd.querySelector('#i-d').value||today();
    if(!a){toast('Add meg a befektetett összeget');return false}
    const first=!ss.invested;Object.assign(ss,{invested:true,investName:bd.querySelector('#i-n').value.trim(),investAmount:a,investDate:d});
    if(first||!(ss.invHist||[]).length){ss.invHist=[{date:d,value:a}];ss.investValue=a}
    save();render();toast('Befektetés mentve')},
  bd=>{moneyInput(bd.querySelector('#i-a'));bd.querySelector('[data-m="del"]')?.addEventListener('click',()=>confirmBox('Törlöd a befektetés adatait? Az eladás számítása megmarad.',()=>{const ss=S.funding.find(x=>x.id===fid).sale;Object.assign(ss,{invested:false,investName:'',investAmount:0,investDate:'',investValue:0,invHist:[]});save();render()}))});
}
function invValueModal(fid){
  const s=S.funding.find(x=>x.id===fid).sale;
  modal(`<h3>Befektetés értékének frissítése</h3><p class="small muted" style="margin-top:-6px">Írd be, mennyit ér most a befektetés (pl. a bank appjából). Az előzmények megmaradnak.</p><div class="form-grid">
    <label class="f">Jelenlegi érték<input class="inp" inputmode="numeric" id="v-a" value="${nf.format(s.investValue||s.investAmount||0)}" autofocus></label>
    <label class="f">Dátum<input class="inp" type="date" id="v-d" value="${today()}"></label></div>
    <div class="modal-foot"><button class="btn" data-m="cancel">Mégse</button><button class="btn primary" data-m="save">Mentés</button></div>`,
  bd=>{const v=amt(bd.querySelector('#v-a').value),d=bd.querySelector('#v-d').value||today();if(!v){toast('Add meg az értéket');return false}
    const ss=S.funding.find(x=>x.id===fid).sale;ss.invHist=(ss.invHist||[]).filter(x=>x.date!==d);ss.invHist.push({date:d,value:v});ss.invHist.sort((a,b)=>a.date.localeCompare(b.date));
    ss.investValue=ss.invHist[ss.invHist.length-1].value;save();render();toast('Érték frissítve')},

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-tstat]')&&!e.target.closest('#layer')){const tsb=e.target.closest('[data-tstat]');const k=S.tasks.find(x=>x.id===tsb.dataset.tstat);const nx={todo:'doing',doing:'done',done:'todo'}[tStat(k)];setTStat(k,nx);save();render();toast(nx==='done'?'🎉 Kész: '+k.title:'Állapot: '+T_STAT[nx]);return}
  const lk=e.target.closest('[data-lock]');
  if(lk){e.preventDefault();toggleLock(lk.dataset.lock,lk.dataset.id);return}
  const g=e.target.closest('[data-go]');
  if(g&&!e.target.closest('[data-act]')){go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='menu'){const sd=document.getElementById('side');sd.classList.add('open');const s=document.createElement('div');s.className='scrim';s.onclick=closeMenu;document.body.appendChild(s);return}
    if(act==='add-expense')return expenseModal(null,a.dataset.cat);
    if(act==='edit-expense')return expenseModal(S.expenses.find(x=>x.id===a.dataset.id));
    if(act==='nav-back')return navBack();
    if(act==='nav-fwd')return navFwd();
    if(act==='add-sub')return subModal(a.dataset.cat);
    if(act==='chap-pay')return expenseModal(null,a.dataset.cat,a.dataset.id);
    if(act==='chap-paid'){const cid=a.dataset.cat,sid=a.dataset.id,c=cat(cid),s=c.subs.find(x=>x.id===sid);
      const ai=document.getElementById('pa-'+sid);let v=amt(ai.value)||amt(ai.placeholder);if(!v){toast('Írd be a kifizetett összeget');ai.focus();return}
      const who=(document.querySelector(`#pw-${sid} .on`)||{}).dataset?.p||ME, d=document.getElementById('pd-'+sid).value||today();
      celebrate(a);S.expenses.push({id:uid(),created:Date.now(),by:ME,catId:cid,subId:sid,desc:s.name,amount:v,paidBy:who,status:'Fizetve',date:d,due:'',planned:0,note:'',locked:true});
      openChaps.add(sid);flushSave();render();toast('✓ Kifizetve: '+ft(v)+' – '+who);return}
    if(act==='chap-done'){const c=cat(a.dataset.cat),s=c.subs.find(x=>x.id===a.dataset.id);celebrate(a);s.done=true;s.doneDate=today();(s.steps||[]).forEach(x=>x.done=true);openChaps.delete(s.id);syncChapters(c);flushSave();render();toast('🎉 Kész: '+s.name);return}
    if(act==='chap-reopen')return confirmBox('Újranyitod a fejezetet? Utána újra szerkeszthető.',()=>{const c=cat(a.dataset.cat),s=c.subs.find(x=>x.id===a.dataset.id);s.done=false;s.doneDate='';syncChapters(c);flushSave();render()},'Újranyitás');
    if(act==='step-add'){addStep(a.dataset.cat,a.dataset.sub);return}
    if(act==='step-del'){const c=cat(a.dataset.cat),s=c.subs.find(x=>x.id===a.dataset.sub);s.steps=s.steps.filter(x=>x.id!==a.dataset.id);flushSave();render();return}
    if(act==='edit-sub')return subModal(a.dataset.cat,a.dataset.id);
    if(act==='add-quote')return quoteModal(null,a.dataset.cat,a.dataset.partner);
    if(act==='edit-brief')return briefModal(cat(a.dataset.id));
    if(act==='edit-quote')return quoteModal(S.quotes.find(x=>x.id===a.dataset.id));
    if(act==='add-util')return utilModal();
    if(act==='add-rec')return recModal(null,a.dataset.type);
    if(act==='edit-rec')return recModal((S.records||[]).find(x=>x.id===a.dataset.id));
    if(act==='rec-pdf')return recPdfModal((S.records||[]).find(x=>x.id===a.dataset.id));
    if(act==='pdf')return printReport(a.dataset.kind,a.dataset.id);
    if(act==='edit-cat')return catModal(cat(a.dataset.id));
    if(act==='add-cat')return catModal(null,a.dataset.scope);
    if(act==='edit-task')return taskModal(S.tasks.find(x=>x.id===a.dataset.id));
    if(act==='cat-up'||act==='cat-down')return moveCat(a.dataset.id,act==='cat-up'?-1:1);
    if(act==='add-fund')return fundModal(null,a.dataset.kind,a.dataset.owner);
    if(act==='ded-edit')return dedModal(a.dataset.fid,a.dataset.id);
    if(act==='ded-toggle'){const d=S.funding.find(x=>x.id===a.dataset.fid).sale.deductions.find(x=>x.id===a.dataset.id);d.settled=!d.settled;flushSave();render();return}
    if(act==='inv-setup')return invSetupModal(a.dataset.fid);
    if(act==='sale-done')return saleDoneModal(a.dataset.fid,a);
    if(act==='sale-reopen')return confirmBox('Újranyitod a Torda eladás számítását? Utána a számok újra szerkeszthetők.',()=>{const f=S.funding.find(x=>x.id===a.dataset.fid);f.sale.done=false;f.locked=false;flushSave();render();toast('Újranyitva – szerkeszthető')},'Szerkesztés');
    if(act==='inv-value')return invValueModal(a.dataset.fid);
    if(act==='edit-fund')return fundModal(S.funding.find(x=>x.id===a.dataset.id));
    if(act==='edit-util')return utilModal(S.utilities.find(x=>x.id===a.dataset.id));
    if(act==='new-task')return taskModal(null,{who:a.dataset.who,catId:a.dataset.cat||(view.startsWith('cat:')?view.slice(4):'')});
    if(act==='toggle-done'){showDone=!showDone;render();return}
    if(act==='toggle-split'){showSplit=!showSplit;render();return}
    if(act==='auto-split'){const h=hazCats();const pool=(S.settings.houseBudget||0)*(1-(S.settings.contingencyPct||0)/100);const sh=h.reduce((x,c)=>x+c.share,0);
      const doIt=()=>{h.forEach(c=>c.budget=Math.round(pool*c.share/sh/100000)*100000);save();render();toast('Keretek felosztva')};
      return h.some(c=>c.budget)?confirmBox('A meglévő témakör-kereteket felülírja. Folytatod?',doIt,'Felülírás'):doIt()}
    if(act==='backup'){const d={exportedAt:new Date().toISOString()};COLLS.forEach(c=>d[c]=S[c]);d.settings=S.settings;
      const blob=new Blob([JSON.stringify(d,null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');
      l.href=u;l.download='alomhaz-mentes-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
      S.settings.lastBackup=today();save();render();toast('Mentés letöltve');return}
    if(act==='restore'){const fi=document.getElementById('restore-file');fi.value='';fi.onchange=()=>{const file=fi.files[0];if(!file)return;const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.cats))throw 0;confirmBox('A visszatöltés minden jelenlegi adatot felülír, Ancsinál és nálad is. Folytatod?',()=>{APP.importData(d);toast('Adatok visszatöltve')},'Visszatöltés')}catch(x){toast('Ez nem érvényes mentésfájl')}};r.readAsText(file)};fi.click();return}
    if(act==='logout')return confirmBox('Kijelentkezel?',()=>Backend.logout(),'Kilépés');
    if(act==='change-pw'){const c=document.getElementById('pw-cur').value,n=document.getElementById('pw-new').value,n2=document.getElementById('pw-new2').value;
      if(!c||!n){toast('Töltsd ki a jelszómezőket');return}if(n.length<6){toast('Az új jelszó legalább 6 karakter legyen');return}if(n!==n2){toast('A két új jelszó nem egyezik');return}
      Backend.changePassword(c,n).then(()=>{['pw-cur','pw-new','pw-new2'].forEach(x=>document.getElementById(x).value='');toast('Jelszó módosítva')}).catch(err=>toast(err&&err.code==='auth/invalid-credential'||err&&err.code==='auth/wrong-password'?'A jelenlegi jelszó nem jó':'Nem sikerült módosítani'));return}
    return;
  }
  const qr=e.target.closest('[data-q-rej]');
  if(qr){const q=S.quotes.find(x=>x.id===qr.dataset.qRej);q.status='Elutasítva';save();render();toast('Ajánlat elutasítva');return}
  const qa=e.target.closest('[data-q-acc]');
  if(qa){const q=S.quotes.find(x=>x.id===qa.dataset.qAcc);q.status='Elfogadva';save();render();toast('Ajánlat elfogadva, lekötött keretként számol');return}
  const td=e.target.closest('[data-task-del]');
  if(td){return confirmBox('Biztosan törlöd ezt a teendőt?',()=>{S.tasks=S.tasks.filter(t=>t.id!==td.dataset.taskDel);save();render()})}
  const cpb=e.target.closest('[data-copy]');
  if(cpb){const v=cpb.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Másolva: '+v)).catch(()=>toast('A másolás nem sikerült'));return}
  const pwb=e.target.closest('[data-pw]');
  if(pwb){document.querySelectorAll(`[data-pw="${pwb.dataset.pw}"]`).forEach(x=>x.classList.toggle('on',x===pwb));return}
  const ch=e.target.closest('[data-chap]');
  if(ch){const id=ch.dataset.chap;openChaps.has(id)?openChaps.delete(id):openChaps.add(id);render();return}
  const bk=e.target.closest('[data-brk]');
  if(bk){const id=bk.dataset.brk;openBreak.has(id)?openBreak.delete(id):openBreak.add(id);render();return}
  const sf=e.target.closest('[data-subf]');
  if(sf&&!e.target.closest('[data-act]')){const cid=sf.dataset.cat;subFilter[cid]=subFilter[cid]===sf.dataset.subf?'':sf.dataset.subf;render();return}
  const tsb=e.target.closest('[data-tstat]');
  if(tsb){const k=S.tasks.find(x=>x.id===tsb.dataset.tstat);const nx={todo:'doing',doing:'done',done:'todo'}[tStat(k)];setTStat(k,nx);save();render();toast(nx==='done'?'🎉 Kész: '+k.title:'Állapot: '+T_STAT[nx]);return}
  const tp=e.target.closest('[data-tperson]');
  if(tp){taskPerson=taskPerson===tp.dataset.tperson?'':tp.dataset.tperson;render();return}
  const tg=e.target.closest('[data-ttag]');
  if(tg){taskTag=tg.dataset.ttag;render();return}
  const rt=e.target.closest('[data-rect]');
  if(rt){recT=rt.dataset.rect;render();return}
  const ftb=e.target.closest('[data-fintab]');
  if(ftb){finTab=ftb.dataset.fintab;render();return}
  const cmb=e.target.closest('[data-commmode]');
  if(cmb){S.funding.find(x=>x.id===cmb.dataset.fid).sale.commMode=cmb.dataset.commmode;save();render();return}
  const da=e.target.closest('[data-ded-add]');
  if(da){S.funding.find(x=>x.id===da.dataset.dedAdd).sale.deductions.push({id:uid(),name:'Új levonás',amount:0,settled:false});save();render();return}
  const dd=e.target.closest('[data-ded-del]');
  if(dd){const s=S.funding.find(x=>x.id===dd.dataset.fid).sale;return confirmBox('Biztosan törlöd ezt a levonást?',()=>{s.deductions=s.deductions.filter(x=>x.id!==dd.dataset.dedDel);save();render()})}
  const rp=e.target.closest('[data-repay]');
  if(rp){const x=S.funding.find(v=>v.id===rp.dataset.repay);x.repaid=true;x.repaidDate=today();save();render();toast('Kölcsön visszafizetettnek jelölve');return}
  const py=e.target.closest('[data-pay]');
  if(py){const x=S.expenses.find(v=>v.id===py.dataset.pay);celebrate(py);x.status='Fizetve';x.date=today();x.locked=true;save();render();toast('✓ Kifizetve és rögzítve');return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.step){const [cid,sid,xid]=t.dataset.step.split('|');const s=cat(cid).subs.find(x=>x.id===sid),x=s.steps.find(y=>y.id===xid);x.done=t.checked;flushSave();
    if(t.checked){celebrate(t);if(s.steps.every(y=>y.done))toast('Minden lépés kész – lezárhatod a fejezetet ✓')}render();return}
  if(t.dataset.taskToggle){const k=S.tasks.find(x=>x.id===t.dataset.taskToggle);setTStat(k,t.checked?'done':'todo');save();render();if(t.checked)toast('🎉 Kész: '+k.title);return}
  if(t.dataset.catRange){cat(t.dataset.catRange).progress=+t.value;flushSave();render();return}
  if(t.dataset.money){cat(t.dataset.money).budget=amt(t.value);flushSave();softRender();return}
  if(t.dataset.f){cat(view.slice(4))[t.dataset.f]=t.value;flushSave();softRender();return}
  if(t.dataset.set){S.settings[t.dataset.set]=t.type==='number'?+t.value:t.value;flushSave();softRender();return}
  if(t.dataset.sale){const f=S.funding.find(x=>x.id===t.dataset.fid),k=t.dataset.sale;
    saleSet(f,k,t.value);save();saleLive(f);softRender();return}
  if(t.dataset.saleStatus){S.funding.find(x=>x.id===t.dataset.saleStatus).status=t.value;save();render();return}
  if(t.dataset.commvat){S.funding.find(x=>x.id===t.dataset.commvat).sale.commVat=t.checked;save();render();return}
  if(t.dataset.saleInv){S.funding.find(x=>x.id===t.dataset.saleInv).sale.invested=t.checked;save();render();return}
  if(t.dataset.ded){const d=S.funding.find(x=>x.id===t.dataset.fid).sale.deductions.find(x=>x.id===t.dataset.did),k=t.dataset.ded;
    d[k]=k==='settled'?t.checked:k==='amount'?amt(t.value):t.value;save();if(k==='settled')render();else{saleLive(S.funding.find(x=>x.id===t.dataset.fid));softRender()}return}
  if(t.dataset.setMoney){S.settings[t.dataset.setMoney]=amt(t.value);flushSave();softRender();return}
  if(t.dataset.filter){filt[t.dataset.filter]=t.value;render();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest('#layer'))return; // ablakok a saját Mentés gombjukkal mentenek
  if(t.readOnly||t.disabled)return; // lezárt mező
  if(isMoneyEl(t))fmtLive(t);
  if(t.dataset.sale&&t.dataset.fid){const f=S.funding.find(x=>x.id===t.dataset.fid);if(f){saleSet(f,t.dataset.sale,t.value);saleLive(f);saveSoon()}return}
  if(t.dataset.ded&&t.dataset.fid&&t.dataset.ded!=='settled'){const f=S.funding.find(x=>x.id===t.dataset.fid),d=f&&f.sale.deductions.find(x=>x.id===t.dataset.did);if(d){
      if(t.dataset.ded==='amount')d.amount=amt(t.value);else d.name=t.value;saleLive(f);saveSoon()}return}
  if(t.id==='rec-q'){recQ=t.value;const l=document.getElementById('rec-list');if(l){l.innerHTML=recListHTML();icons()}return}
  if(t.dataset.catRange){document.getElementById('pv').textContent=t.value+'%';cat(t.dataset.catRange).progress=+t.value;saveSoon();return}
  if(t.dataset.money){const c=cat(t.dataset.money);if(c){c.budget=amt(t.value);c.budgetAuto=false;saveSoon()}return}
  if(t.dataset.chapplan){const [cid,sid]=t.dataset.chapplan.split('|');const c=cat(cid),s=c&&c.subs.find(x=>x.id===sid);if(s){s.planned=amt(t.value);syncChapters(c);saveSoon()}return}
  if(t.dataset.f&&view.startsWith('cat:')){const c=cat(view.slice(4));if(c){c[t.dataset.f]=t.value;saveSoon()}return}
  if(t.dataset.set){S.settings[t.dataset.set]=t.type==='number'?+t.value:t.value;saveSoon();return}
  if(t.dataset.setMoney){S.settings[t.dataset.setMoney]=amt(t.value);saveSoon();return}
});
// Mezőből kilépéskor: azonnali mentés + szép számformátum
document.addEventListener('focusout',e=>{
  const t=e.target;if(!t||t.closest&&t.closest('#layer'))return;
  const isMoney=t.dataset&&(t.dataset.chapplan!==undefined||t.dataset.money!==undefined||t.dataset.setMoney!==undefined||t.dataset.ded==='amount'||(t.dataset.sale&&!/Pct$|investName|investDate/.test(t.dataset.sale)));
  if(isMoney){const v=amt(t.value);t.value=v?nf.format(v):''}
  if(t.dataset&&(t.dataset.chapplan||t.dataset.money!==undefined||t.dataset.f||t.dataset.set||t.dataset.setMoney!==undefined||t.dataset.sale||t.dataset.ded||t.dataset.catRange)){flushSave();softRender()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.newstep){e.preventDefault();const [cid,sid]=e.target.dataset.newstep.split('|');addStep(cid,sid);return}
  if((e.metaKey&&e.key==='[')||(e.altKey&&e.key==='ArrowLeft')){e.preventDefault();navBack();return}
  if((e.metaKey&&e.key===']')||(e.altKey&&e.key==='ArrowRight')){e.preventDefault();navFwd();return}
  if(e.key==='Escape'){const L=document.getElementById('layer');if(!L.querySelector('input,textarea,select'))L.innerHTML=''}if(e.key==='Enter'&&e.target.id==='nt-title')document.querySelector('[data-act="add-task"]').click()});
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqa48WA4RB820Ql3C9QTjNNA_PDR_cZ9g",
  authDomain: "alomhaz-a8ca0.firebaseapp.com",
  projectId: "alomhaz-a8ca0",
  storageBucket: "alomhaz-a8ca0.firebasestorage.app",
  messagingSenderId: "674012650771",
  appId: "1:674012650771:web:86f57e8a98e9c3195e0ee6"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { db = initializeFirestore(app, {}); }

const ROOT = ['projektek', 'alomhaz'];
const col = c => collection(db, ...ROOT, c);
const settingsRef = () => doc(db, ...ROOT, 'meta', 'settings');
let unsubs = [], pending = 0;
const track = p => { pending++; APP.setStatus(navigator.onLine ? 'pending' : 'offline');
  p.then(() => { pending--; if (!pending) APP.setStatus(navigator.onLine ? 'ok' : 'offline'); })
   .catch(err => { pending--; console.error(err); APP.setStatus('error'); }); };

window.Backend = {
  put: (c, id, data) => track(setDoc(doc(db, ...ROOT, c, id), data)),
  del: (c, id) => track(deleteDoc(doc(db, ...ROOT, c, id))),
  putSettings: data => track(setDoc(settingsRef(), data)),
  logout: () => signOut(auth).then(() => location.reload()),
  changePassword: async (cur, next) => {
    const u = auth.currentUser;
    await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, cur));
    await updatePassword(u, next);
  }
};
addEventListener('online', () => APP.setStatus(pending ? 'pending' : 'ok'));
addEventListener('offline', () => APP.setStatus('offline'));

async function start(user) {
  window.CURRENT_EMAIL = user.email;
  try {
    const [cs, st] = await Promise.all([getDocs(col('cats')), getDoc(settingsRef())]);
    if (cs.empty && !st.exists()) APP.seedAll();
  } catch (e) {
    if (e && e.code === 'permission-denied') { showLogin('Ehhez a fiókhoz nincs hozzáférés.'); signOut(auth); return; }
    console.warn('Első betöltés gyorsítótárból', e);
  }
  let first = new Set();
  let readyFired = false;
  const done = name => { first.add(name); if (!readyFired && first.size === 8) { readyFired = true; APP.ready(user.email); } };
  ['cats','expenses','quotes','tasks','funding','utilities','records'].forEach(c => {
    unsubs.push(onSnapshot(col(c), snap => { APP.applyRemote(c, snap.docs.map(d => d.data())); done(c); },
      err => { console.error(err); APP.setStatus('error'); done(c); }));
  });
  unsubs.push(onSnapshot(settingsRef(), s => { if (s.exists()) APP.applySettings(s.data()); done('settings'); },
    err => { console.error(err); done('settings'); }));
}

const L = document.getElementById('login');
function showLogin(msg) { L.hidden = false; document.getElementById('li-err').textContent = msg || ''; }
onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  if (user) { L.hidden = true; start(user); } else showLogin();
});
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const em = document.getElementById('li-email').value.trim(), pw = document.getElementById('li-pw').value;
  document.getElementById('li-err').textContent = '';
  try { await signInWithEmailAndPassword(auth, em, pw); }
  catch (err) { document.getElementById('li-err').textContent = err.code === 'auth/too-many-requests' ? 'Túl sok próbálkozás, várj pár percet.' : err.code === 'auth/network-request-failed' ? 'Nincs internetkapcsolat.' : 'Hibás e-mail-cím vagy jelszó.'; }
});
document.getElementById('li-forgot').addEventListener('click', async () => {
  const em = document.getElementById('li-email').value.trim();
  if (!em) { document.getElementById('li-err').textContent = 'Előbb írd be az e-mail-címed.'; return; }
  try { await sendPasswordResetEmail(auth, em); document.getElementById('li-err').textContent = 'Elküldtük a jelszóváltoztató levelet.'; }
  catch (err) { document.getElementById('li-err').textContent = 'Nem sikerült elküldeni, ellenőrizd a címet.'; }
});
</script>
</body>
</html>
